<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo de Productos</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary-color: #2c3e50;
            --accent-color: #27ae60;
            --whatsapp-color: #25d366;
            --bg-color: #f8f9fa;
            --card-bg: #ffffff;
            --text-color: #333333;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
        }

        header {
            background-color: var(--primary-color);
            color: white;
            padding: 2rem 1rem;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        header h1 {
            font-size: 2.2rem;
            margin-bottom: 0.5rem;
        }

        .container {
            max-width: 1200px;
            margin: 2rem auto;
            padding: 0 1rem;
        }

        /* Grid de Productos */
        .catalog-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 2rem;
        }

        .product-card {
            background: var(--card-bg);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .product-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.12);
        }

        .product-image-container {
            width: 100%;
            height: 220px;
            background-color: #f0f0f0;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .product-image-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s ease;
        }

        .product-card:hover .product-image-container img {
            transform: scale(1.05);
        }

        .product-info {
            padding: 1.25rem;
            text-align: center;
        }

        .product-price {
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--accent-color);
            margin-bottom: 0.5rem;
        }

        .product-name {
            font-size: 1rem;
            font-weight: 600;
            color: var(--primary-color);
            margin-bottom: 1rem;
            text-transform: capitalize;
        }

        .quote-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            padding: 0.75rem;
            background-color: var(--whatsapp-color);
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            transition: background-color 0.2s;
        }

        .quote-btn:hover {
            background-color: #20ba5a;
        }

        /* Pop-up de Bienvenida */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            opacity: 1;
            transition: opacity 0.3s ease;
        }

        .modal-overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .modal-content {
            background: white;
            width: 90%;
            max-width: 450px;
            padding: 2.5rem 2rem;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .modal-logo {
            width: 80px;
            height: 80px;
            margin: 0 auto 1.5rem auto;
            border-radius: 50%;
            overflow: hidden;
            border: 3px solid var(--primary-color);
        }

        .modal-logo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .modal-close-btn {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 0.75rem 2rem;
            font-size: 1rem;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
        }

        .loading-text {
            text-align: center;
            grid-column: 1 / -1;
            padding: 3rem;
            color: #7f8c8d;
            font-size: 1.1rem;
        }
    </style>
</head>
<body>

    <!-- POP-UP -->
    <div class="modal-overlay" id="welcomeModal">
        <div class="modal-content">
            <div class="modal-logo">
                <img src="https://via.placeholder.com/150" alt="Logo">
            </div>
            <h2>¡Bienvenido a nuestro Catálogo!</h2>
            <p>Explora nuestros productos y presiona "Cotizar" para hacer tu pedido vía WhatsApp.</p>
            <button class="modal-close-btn" onclick="closeModal()">Ver Catálogo</button>
        </div>
    </div>

    <!-- ENCABEZADO -->
    <header>
        <h1>Catálogo de Productos</h1>
        <p>Consulta precios y disponibilidad en tiempo real</p>
    </header>

    <div class="container">
        <div class="catalog-grid" id="catalogGrid">
            <div class="loading-text">Cargando imágenes desde Google Drive...</div>
        </div>
    </div>

    <script>
        // CONFIGURACIÓN
        const WHATSAPP_NUMBER = "5215618782196"; // Tu número de WhatsApp
        const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbx3TzW77Za5038JxAZ8y_n9R_KA-NqtVXryrH8bDDTO6Wv8OpI_uEdS-ATAtCWS8Qavzg/exec"; // Pega aquí el Web App URL publicado

        // Procesa el nombre del archivo: "150_Nombre_Del_Producto.png"
        function parseFilename(filename) {
            const cleanName = filename.replace(/\.png$/i, "").replace(/\.[^/.]+$/, "");
            const parts = cleanName.split('_');
            
            let price = "0";
            let productName = cleanName;

            if (parts.length > 1 && !isNaN(parts[0])) {
                price = parts[0];
                productName = parts.slice(1).join(' ').replace(/_/g, ' ');
            } else {
                productName = cleanName.replace(/_/g, ' ');
            }

            return { price, name: productName };
        }

        // Obtiene las imágenes consumiendo Google Apps Script
        async function fetchDriveImages() {
            const grid = document.getElementById('catalogGrid');
            try {
                const response = await fetch(APPS_SCRIPT_URL);
                const images = await response.json();

                grid.innerHTML = '';

                if (!images || images.length === 0) {
                    grid.innerHTML = '<div class="loading-text">No se encontraron imágenes en la carpeta.</div>';
                    return;
                }

                images.forEach(item => {
                    const parsed = parseFilename(item.name);
                    const message = encodeURIComponent(`Hola, me interesa cotizar el siguiente producto: *${parsed.name}* con precio de *$${parsed.price}*.`);
                    const whatsappLink = `https://wa.me/${WHATSAPP_NUMBER}?text=${message}`;

                    const card = document.createElement('div');
                    card.className = 'product-card';
                    card.innerHTML = `
                        <div class="product-image-container">
                            <img src="${item.url}" alt="${parsed.name}" loading="lazy" referrerpolicy="no-referrer">
                        </div>
                        <div class="product-info">
                            <div class="product-price">$${parsed.price}</div>
                            <div class="product-name">${parsed.name}</div>
                            <a href="${whatsappLink}" target="_blank" class="quote-btn">
                                <i class="fab fa-whatsapp"></i> Cotizar
                            </a>
                        </div>
                    `;
                    grid.appendChild(card);
                });
            } catch (error) {
                console.error("Error al cargar imágenes:", error);
                grid.innerHTML = '<div class="loading-text">Error al obtener las imágenes.</div>';
            }
        }

        function closeModal() {
            document.getElementById('welcomeModal').classList.add('hidden');
        }

        window.addEventListener('DOMContentLoaded', fetchDriveImages);
    </script>
</body>
</html>
