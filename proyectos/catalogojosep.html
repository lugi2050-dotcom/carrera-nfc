<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo de Productos</title>
    <!-- Tailwind CSS para diseño moderno -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- FontAwesome para íconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-50 text-gray-800 font-sans antialiased">

    <!-- POP-UP DE BIENVENIDA / MODAL -->
    <div id="welcomeModal" class="fixed inset-0 z-50 flex items-center justify-center bg-black/60 backdrop-blur-sm p-4">
        <div class="bg-white rounded-2xl shadow-2xl max-w-md w-full p-6 text-center transform transition-all">
            <!-- LOGO: Reemplaza src por la ruta de tu logo -->
            <div class="mx-auto w-24 h-24 mb-4 flex items-center justify-center">
                <img src="tu-logo.png" alt="Logo" class="max-h-full max-w-full object-contain" onerror="this.src='https://via.placeholder.com/100?text=Mi+Logo'">
            </div>
            
            <h2 class="text-2xl font-bold text-gray-900 mb-2">¡Bienvenido a nuestro Catálogo!</h2>
            <p class="text-gray-600 text-sm mb-6 leading-relaxed">
                Explora nuestra lista de productos disponibles. Haz clic en el botón <strong>"Cotizar"</strong> en cualquier artículo para solicitar información directa vía WhatsApp.
            </p>
            
            <button onclick="closeModal()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3 px-4 rounded-xl transition duration-200 shadow-md cursor-pointer">
                Ver Catálogo
            </button>
        </div>
    </div>

    <!-- ENCABEZADO -->
    <header class="bg-white shadow-sm sticky top-0 z-30">
        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="text-xl font-bold text-gray-900 flex items-center gap-2">
                <i class="fa-solid fa-store text-indigo-600"></i> Catálogo de Productos
            </h1>
            <span class="text-xs font-semibold bg-emerald-100 text-emerald-800 py-1.5 px-3 rounded-full border border-emerald-200 flex items-center gap-1.5">
                <i class="fa-brands fa-whatsapp text-sm"></i> Cotizaciones en línea
            </span>
        </div>
    </header>

    <!-- CONTENEDOR DEL CATÁLOGO -->
    <main class="max-w-7xl mx-auto px-4 py-8">
        <div id="catalogo-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
            <!-- Mensaje de carga inicial -->
            <div class="col-span-full text-center py-12 text-gray-400">
                <i class="fa-solid fa-circle-notch fa-spin text-3xl mb-2 text-indigo-600"></i>
                <p>Cargando productos...</p>
            </div>
        </div>
    </main>

    <script>
        // CONFIGURA TU NÚMERO DE WHATSAPP AQUÍ (Código de país + Número, Ej: 5215500000000)
        const NUMERO_WHATSAPP = "5215500000000";

        // Función corregida para cerrar el pop-up de forma segura
        function closeModal() {
            const modal = document.getElementById('welcomeModal');
            if (modal) {
                modal.style.display = 'none';
            }
        }

        // Función para separar Precio y Nombre del archivo (Formato esperado: Precio_Nombre.png)
        function parseNombreImagen(nombreArchivo) {
            // 1. Eliminar la extensión (.png, .jpg, etc.)
            let sinExt = nombreArchivo.substring(0, nombreArchivo.lastIndexOf('.')) || nombreArchivo;
            
            // 2. Separar por el primer guion bajo (_)
            let indiceGuion = sinExt.indexOf('_');
            let precio = "";
            let nombre = "";

            if (indiceGuion !== -1) {
                precio = sinExt.substring(0, indiceGuion).trim();
                nombre = sinExt.substring(indiceGuion + 1).replace(/_/g, ' ').trim();
            } else {
                precio = "Consultar";
                nombre = sinExt.replace(/_/g, ' ').trim();
            }

            // Formatear precio si es numérico
            let precioFormateado = !isNaN(precio) && precio !== "" ? `$${Number(precio).toLocaleString('es-MX')}` : precio;

            return {
                nombre: nombre,
                precio: precioFormateado
            };
        }

        // Función para redirigir a WhatsApp con el mensaje prellenado
        function cotizarPorWhatsApp(producto, precio) {
            const mensaje = `Hola, me interesa cotizar el siguiente producto:\n\n📌 *${producto}*\n💰 Precio: ${precio}\n\n¿Tienen disponibilidad?`;
            const url = `https://wa.me/${NUMERO_WHATSAPP}?text=${encodeURIComponent(mensaje)}`;
            window.open(url, '_blank');
        }

        // FUNCIÓN PRINCIPAL CON TU FETCH
        async function cargarCatalogo() {
            const grid = document.getElementById('catalogo-grid');

            try {
                // =========================================================================
                // INSERTA LA URL DE TU FETCH O SCRIPT AQUÍ
                // =========================================================================
                const response = await fetch('https://script.google.com/macros/s/AKfycbx3TzW77Za5038JxAZ8y_n9R_KA-NqtVXryrH8bDDTO6Wv8OpI_uEdS-ATAtCWS8Qavzg/exec');
                const imagenes = await response.json(); 

                grid.innerHTML = ""; // Limpia el cargando

                imagenes.forEach(img => {
                    /*
                      Ajusta 'img.nombre' e 'img.url' según cómo se llamen las 
                      propiedades dentro de tu JSON recibido.
                    */
                    const nombreArchivo = img.nombre || img.name || img;
                    const urlImagen = img.url || img.link || img;

                    // Procesar el nombre del archivo
                    const datos = parseNombreImagen(nombreArchivo);

                    // Generar tarjeta HTML
                    const card = document.createElement('div');
                    card.className = "bg-white rounded-2xl shadow-sm hover:shadow-md transition duration-300 border border-gray-100 flex flex-col overflow-hidden";

                    card.innerHTML = `
                        <div class="h-48 bg-gray-100 overflow-hidden relative">
                            <img src="${urlImagen}" alt="${datos.nombre}" class="w-full h-full object-cover hover:scale-105 transition duration-500" loading="lazy">
                        </div>
                        <div class="p-5 flex flex-col flex-grow justify-between">
                            <div>
                                <h3 class="font-semibold text-gray-800 text-base mb-1 capitalize">${datos.nombre}</h3>
                                <p class="text-indigo-600 font-bold text-lg mb-4">${datos.precio}</p>
                            </div>
                            <button onclick="cotizarPorWhatsApp('${datos.nombre}', '${datos.precio}')" 
                                class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-medium py-2.5 px-4 rounded-xl transition duration-200 flex items-center justify-center gap-2 cursor-pointer shadow-sm">
                                <i class="fa-brands fa-whatsapp text-lg"></i> Cotizar
                            </button>
                        </div>
                    `;
                    grid.appendChild(card);
                });

            } catch (error) {
                console.error("Error al cargar el catálogo:", error);
                grid.innerHTML = `
                    <div class="col-span-full text-center py-10 text-red-500">
                        <i class="fa-solid fa-triangle-exclamation text-3xl mb-2"></i>
                        <p>No se pudieron cargar los productos. Revisa tu endpoint de fetch.</p>
                    </div>
                `;
            }
        }

        // Iniciar al cargar el sitio
        document.addEventListener('DOMContentLoaded', cargarCatalogo);
    </script>
</body>
</html>
