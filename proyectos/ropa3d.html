<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Probador Virtual - Catálogo AR</title>
  
  <!-- Estilos CSS -->
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: #121212;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    h1 {
      font-size: 1.5rem;
      margin-bottom: 10px;
    }

    #status {
      font-size: 0.9rem;
      color: #00ffcc;
      margin-bottom: 15px;
    }

    /* Contenedor de la Cámara y Realidad Aumentada */
    .ar-container {
      position: relative;
      width: 100%;
      max-width: 480px;
      height: 640px;
      background: #000;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    }

    #webcam, #ar-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1); /* Efecto espejo para la cámara frontal */
    }

    #ar-canvas {
      z-index: 10;
      pointer-events: none;
    }

    /* Catálogo de prendas inferior */
    .catalog {
      display: flex;
      gap: 15px;
      margin-top: 20px;
      padding: 10px;
      overflow-x: auto;
      max-width: 480px;
    }

    .catalog-item {
      background: #222;
      border: 2px solid #444;
      border-radius: 8px;
      padding: 10px;
      cursor: pointer;
      text-align: center;
      transition: 0.3s;
    }

    .catalog-item:hover {
      border-color: #00ffcc;
    }

    .catalog-item img {
      width: 60px;
      height: 60px;
      object-fit: contain;
    }
  </style>

  <!-- Librerías de MediaPipe Pose -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>
</head>
<body>

  <h1>Probador Virtual AR</h1>
  <div id="status">Cargando modelo de seguimiento...</div>

  <!-- Contenedor Principal de la Cámara -->
  <div class="ar-container">
    <video id="webcam" playsinline></video>
    <canvas id="ar-canvas"></canvas>
  </div>

  <!-- Catálogo de Prendas (Rutas Locales) -->
  <div class="catalog">
    <div class="catalog-item" onclick="changeGarment('hoodie1.png')">
      <img src="/proyectos/hoodie1.png" alt="Hoodie">
      <p style="font-size: 12px; margin: 5px 0 0 0;">Hoodie</p>
    </div>
    <!-- Puedes agregar más prendas aquí cambiando la ruta local -->
    <div class="catalog-item" onclick="changeGarment('hoodie1.png')">
      <img src="/proyectos/hoodie1.png" alt="Playera">
      <p style="font-size: 12px; margin: 5px 0 0 0;">Playera</p>
    </div>
  </div>

  <!-- Lógica en JavaScript -->
  <script>
    const videoElement = document.getElementById('webcam');
    const canvasElement = document.getElementById('ar-canvas');
    const canvasCtx = canvasElement.getContext('2d');
    const statusText = document.getElementById('status');

    let currentGarmentImg = new Image();
    let garmentLoaded = false;

    // Función para cambiar la prenda seleccionada de forma local
    function changeGarment(imgSrc) {
      garmentLoaded = false;
      statusText.innerText = "Cargando prenda...";
      
      currentGarmentImg.crossOrigin = "anonymous"; // Evita bloqueos de seguridad
      currentGarmentImg.src = imgSrc;
      
      currentGarmentImg.onload = function() {
        garmentLoaded = true;
        statusText.innerText = "Realidad Aumentada activa";
      };
      
      currentGarmentImg.onerror = function() {
        statusText.innerText = "Error al cargar la imagen local (revisa la ruta)";
      };
    }

    // Cargar la primera prenda por defecto al iniciar
    changeGarment('hoodie1.png');

    // Procesamiento de los resultados de MediaPipe Pose
    function onPoseResults(results) {
      // Ajustar dimensiones del canvas dinámicamente
      canvasElement.width = videoElement.videoWidth || 640;
      canvasElement.height = videoElement.videoHeight || 480;

      canvasCtx.save();
      canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
      
      // Dibujar el video de la cámara
      canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);

      if (results.poseLandmarks && garmentLoaded) {
        const landmarks = results.poseLandmarks;

        // Landmark 11: Hombro Izquierdo | Landmark 12: Hombro Derecho
        const leftShoulder = landmarks[11];
        const rightShoulder = landmarks[12];

        // Validar que ambos hombros se detecten correctamente
        if (leftShoulder.visibility > 0.4 && rightShoulder.visibility > 0.4) {
          const canvasW = canvasElement.width;
          const canvasH = canvasElement.height;

          // Coordenadas de los hombros en píxeles
          const x1 = leftShoulder.x * canvasW;
          const y1 = leftShoulder.y * canvasH;
          const x2 = rightShoulder.x * canvasW;
          const y2 = rightShoulder.y * canvasH;

          // Distancia entre hombros y punto medio del torso
          const shoulderWidth = Math.hypot(x2 - x1, y2 - y1);
          const midX = (x1 + x2) / 2;
          const midY = (y1 + y2) / 2;

          // Escala proporcional de la prenda ajustada al ancho de hombros
          const garmentWidth = shoulderWidth * 2.1;
          const aspectRatio = currentGarmentImg.height / currentGarmentImg.width;
          const garmentHeight = garmentWidth * aspectRatio;

          // Cálculo del ángulo de inclinación del torso (Efecto filtro)
          const angle = Math.atan2(y2 - y1, x2 - x1);

          canvasCtx.save();
          
          // Posicionamiento en el punto medio + desplazamiento vertical para ubicar en el pecho
          canvasCtx.translate(midX, midY + (garmentHeight * 0.35)); 
          canvasCtx.rotate(angle);
          
          canvasCtx.rotate(Math.PI);
          // Dibujar la prenda centrada en el torso
          canvasCtx.drawImage(
            currentGarmentImg, 
            -garmentWidth / 2, 
            -garmentHeight * 0.25, 
            garmentWidth, 
            garmentHeight
          );
          
          canvasCtx.restore();
        }
      }
      canvasCtx.restore();
    }

    // Inicializar MediaPipe Pose
    const pose = new Pose({
      locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}`
    });

    pose.setOptions({
      modelComplexity: 1,
      smoothLandmarks: true,
      enableSegmentation: false,
      minDetectionConfidence: 0.5,
      minTrackingConfidence: 0.5
    });

    pose.onResults(onPoseResults);

    // Configurar la cámara del dispositivo móvil
    const camera = new Camera(videoElement, {
      onFrame: async () => {
        await pose.send({ image: videoElement });
      },
      width: 640,
      height: 480
    });

    camera.start()
      .then(() => {
        statusText.innerText = "Alinea tus hombros a la cámara";
      })
      .catch(err => {
        statusText.innerText = "Error al acceder a la cámara";
        console.error(err);
      });
  </script>
</body>
</html>
