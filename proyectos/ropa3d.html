<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tienda & Probador Virtual AR</title>
  
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px 10px;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #121212;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    h1 {
      font-size: 1.6rem;
      margin: 0 0 15px 0;
      text-align: center;
    }

    /* Vistas (Catálogo vs AR) */
    .view {
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .hidden {
      display: none !important;
    }

    /* Estilo del Catálogo */
    .catalog-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
      width: 100%;
    }

    .product-card {
      background: #1e1e1e;
      border: 1px solid #333;
      border-radius: 16px;
      padding: 15px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      transition: all 0.3s ease;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }

    .product-card:hover {
      border-color: #00ffcc;
      transform: translateY(-3px);
    }

    .product-card img {
      width: 100px;
      height: 100px;
      object-fit: contain;
      margin-bottom: 10px;
    }

    .product-info {
      text-align: center;
      width: 100%;
      margin-bottom: 12px;
    }

    .product-name {
      font-size: 0.95rem;
      font-weight: 600;
      color: #fff;
      margin: 0 0 5px 0;
    }

    .product-price {
      font-size: 0.9rem;
      color: #00ffcc;
      font-weight: bold;
      margin: 0;
    }

    .btn-try {
      background: #00ffcc;
      color: #121212;
      border: none;
      padding: 8px 16px;
      border-radius: 8px;
      font-weight: bold;
      font-size: 0.85rem;
      cursor: pointer;
      width: 100%;
      transition: background 0.2s;
    }

    .btn-try:hover {
      background: #00cca3;
    }

    /* Vista de Realidad Aumentada (Cámara) */
    #status {
      font-size: 0.85rem;
      color: #00ffcc;
      margin-bottom: 10px;
      text-align: center;
      font-weight: 500;
    }

    .ar-container {
      position: relative;
      width: 100%;
      max-width: 420px;
      height: 520px;
      background: #000;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.7);
      border: 1px solid #333;
      margin-bottom: 15px;
    }

    #webcam, #ar-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1);
    }

    #ar-canvas {
      z-index: 10;
      pointer-events: none;
    }

    .btn-back {
      background: #333;
      color: #fff;
      border: 1px solid #555;
      padding: 10px 20px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      width: 100%;
      max-width: 420px;
      transition: background 0.2s;
    }

    .btn-back:hover {
      background: #444;
    }
  </style>

  <!-- Librerías de MediaPipe Pose -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>
</head>
<body>

  <!-- 1. VISTA DE CATÁLOGO -->
  <div id="catalog-view" class="view">
    <h1>Catálogo de Prendas</h1>
    <div class="catalog-grid">
      
      <!-- Producto 1: Hoodie -->
      <div class="product-card">
        <img src="hoodie.png" alt="Hoodie Urbana">
        <div class="product-info">
          <p class="product-name">Hoodie Urbana</p>
          <p class="product-price">$599.00 MXN</p>
        </div>
        <button class="btn-try" onclick="openAR('hoodie.png')">Probar</button>
      </div>

      <!-- Producto 2: Playera -->
      <div class="product-card">
        <img src="playera.png" alt="Playera Casual">
        <div class="product-info">
          <p class="product-name">Playera Casual</p>
          <p class="product-price">$299.00 MXN</p>
        </div>
        <button class="btn-try" onclick="openAR('playera.png')">Probar</button>
      </div>

    </div>
  </div>

  <!-- 2. VISTA DE REALIDAD AUMENTADA (Cámara) -->
  <div id="ar-view" class="view hidden">
    <h1>Probador Virtual</h1>
    <div id="status">Iniciando cámara...</div>

    <div class="ar-container">
      <video id="webcam" playsinline></video>
      <canvas id="ar-canvas"></canvas>
    </div>

    <button class="btn-back" onclick="closeAR()">Volver al Catálogo</button>
  </div>

  <script>
    const videoElement = document.getElementById('webcam');
    const canvasElement = document.getElementById('ar-canvas');
    const canvasCtx = canvasElement.getContext('2d');
    const statusText = document.getElementById('status');

    const catalogView = document.getElementById('catalog-view');
    const arView = document.getElementById('ar-view');

    let currentGarmentImg = new Image();
    let garmentLoaded = false;
    let cameraInstance = null;

    // Función para abrir la cámara al hacer clic en "Probar"
    function openAR(imgFileName) {
      // Cambiar de vista
      catalogView.classList.add('hidden');
      arView.classList.remove('hidden');

      garmentLoaded = false;
      statusText.innerText = "Cargando prenda...";

      currentGarmentImg.crossOrigin = "anonymous";
      currentGarmentImg.src = imgFileName;

      currentGarmentImg.onload = function() {
        garmentLoaded = true;
        statusText.innerText = "Realidad Aumentada activa";
      };

      currentGarmentImg.onerror = function() {
        statusText.innerText = "Error: No se encontró la imagen '" + imgFileName + "'";
      };

      // Iniciar la cámara si no está iniciada
      if (!cameraInstance) {
        cameraInstance = new Camera(videoElement, {
          onFrame: async () => {
            await pose.send({ image: videoElement });
          },
          width: 640,
          height: 480
        });
      }

      cameraInstance.start()
        .then(() => {
          statusText.innerText = "Alinea tus hombros a la cámara";
        })
        .catch(err => {
          statusText.innerText = "Error al acceder a la cámara";
          console.error(err);
        });
    }

    // Función para cerrar la cámara y volver al catálogo
    function closeAR() {
      if (cameraInstance) {
        // Pausar la transmisión de video de la cámara
        const stream = videoElement.srcObject;
        if (stream) {
          stream.getTracks().forEach(track => track.stop());
        }
        videoElement.srcObject = null;
        cameraInstance = null;
      }

      // Regresar a la vista del catálogo
      arView.classList.add('hidden');
      catalogView.classList.remove('hidden');
    }

    // Procesar seguimiento de MediaPipe con Hombros y Caderas
    function onPoseResults(results) {
      if (arView.classList.contains('hidden')) return; // No procesar si estamos en el catálogo

      canvasElement.width = videoElement.videoWidth || 640;
      canvasElement.height = videoElement.videoHeight || 480;

      canvasCtx.save();
      canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);

      canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);

      if (results.poseLandmarks && garmentLoaded) {
        const landmarks = results.poseLandmarks;
        
        const leftShoulder = landmarks[11];
        const rightShoulder = landmarks[12];
        const leftHip = landmarks[23];
        const rightHip = landmarks[24];

        if (leftShoulder.visibility > 0.4 && rightShoulder.visibility > 0.4) {
          const canvasW = canvasElement.width;
          const canvasH = canvasElement.height;

          const x1 = leftShoulder.x * canvasW;
          const y1 = leftShoulder.y * canvasH;
          const x2 = rightShoulder.x * canvasW;
          const y2 = rightShoulder.y * canvasH;

          const shoulderWidth = Math.hypot(x2 - x1, y2 - y1);
          const midX = (x1 + x2) / 2;
          const midY = (y1 + y2) / 2;

          const garmentWidth = shoulderWidth * 2.1;

          let garmentHeight;
          if (leftHip.visibility > 0.3 && rightHip.visibility > 0.3) {
            const hipX = ((leftHip.x + rightHip.x) / 2) * canvasW;
            const hipY = ((leftHip.y + rightHip.y) / 2) * canvasH;
            const torsoLength = Math.hypot(hipX - midX, hipY - midY);
            garmentHeight = torsoLength * 1.4;
          } else {
            const aspectRatio = currentGarmentImg.height / currentGarmentImg.width;
            garmentHeight = garmentWidth * aspectRatio;
          }

          const angle = Math.atan2(y2 - y1, x2 - x1);

          canvasCtx.save();
          canvasCtx.translate(midX, midY + (garmentHeight * 0.05)); 
          canvasCtx.rotate(angle);
          canvasCtx.rotate(Math.PI);

          canvasCtx.drawImage(
            currentGarmentImg, 
            -garmentWidth / 2, 
            -garmentHeight * 0.25, 
            garmentWidth, 
            garmentHeight
          );

          canvasCtx.restore();
        }
      }
      canvasCtx.restore();
    }

    // Inicializar MediaPipe Pose
    const pose = new Pose({
      locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}`
    });

    pose.setOptions({
      modelComplexity: 1,
      smoothLandmarks: true,
      enableSegmentation: false,
      minDetectionConfidence: 0.5,
      minTrackingConfidence: 0.5
    });

    pose.onResults(onPoseResults);
  </script>
</body>
</html>
