<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Probador Virtual - Catálogo AR</title>
  
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px 10px;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #121212;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    h1 {
      font-size: 1.6rem;
      margin: 0 0 5px 0;
      text-align: center;
    }

    #status {
      font-size: 0.85rem;
      color: #00ffcc;
      margin-bottom: 15px;
      text-align: center;
      font-weight: 500;
    }

    /* Contenedor Principal de Realidad Aumentada */
    .ar-container {
      position: relative;
      width: 100%;
      max-width: 420px;
      height: 520px;
      background: #000;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.7);
      border: 1px solid #333;
    }

    #webcam, #ar-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1); /* Efecto espejo para la cámara */
    }

    #ar-canvas {
      z-index: 10;
      pointer-events: none;
    }

    /* Vista de Catálogo */
    .catalog-section {
      width: 100%;
      max-width: 420px;
      margin-top: 20px;
    }

    .catalog-title {
      font-size: 1.1rem;
      margin-bottom: 12px;
      color: #ddd;
      border-bottom: 1px solid #333;
      padding-bottom: 5px;
    }

    .catalog-grid {
      display: grid;
      grid-template-columns: repeat( auto-fit, minmax(110px, 1fr) );
      gap: 12px;
      width: 100%;
    }

    .catalog-card {
      background: #1e1e1e;
      border: 2px solid #333;
      border-radius: 12px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      transition: all 0.25s ease;
    }

    .catalog-card:hover, .catalog-card.active {
      border-color: #00ffcc;
      background: #282828;
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(0, 255, 204, 0.15);
    }

    .catalog-card img {
      width: 80px;
      height: 80px;
      object-fit: contain;
      margin-bottom: 8px;
    }

    .catalog-card span {
      font-size: 0.85rem;
      font-weight: 600;
      color: #eee;
      text-align: center;
    }
  </style>

  <!-- Librerías de MediaPipe Pose -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>
</head>
<body>

  <h1>Probador Virtual AR</h1>
  <div id="status">Iniciando cámara y modelo...</div>

  <!-- Visor de Cámara y Canvas -->
  <div class="ar-container">
    <video id="webcam" playsinline></video>
    <canvas id="ar-canvas"></canvas>
  </div>

  <!-- Vista de Catálogo -->
  <div class="catalog-section">
    <div class="catalog-title">Selecciona una prenda:</div>
    <div class="catalog-grid">
      
      <!-- Ruta directa al mismo nivel que index.html -->
      <div class="catalog-card active" onclick="selectGarment('hoodie.png', this)">
        <img src="hoodie.png" alt="Sudadera Hoodie">
        <span>Hoodie</span>
      </div>

      <div class="catalog-card" onclick="selectGarment('playera.png', this)">
        <img src="playera.png" alt="Playera Casual">
        <span>Playera</span>
      </div>

    </div>
  </div>

  <script>
    const videoElement = document.getElementById('webcam');
    const canvasElement = document.getElementById('ar-canvas');
    const canvasCtx = canvasElement.getContext('2d');
    const statusText = document.getElementById('status');

    let currentGarmentImg = new Image();
    let garmentLoaded = false;

    // Cambiar prenda activa desde el catálogo
    function selectGarment(imgFileName, element) {
      document.querySelectorAll('.catalog-card').forEach(card => card.classList.remove('active'));
      if (element) element.classList.add('active');

      garmentLoaded = false;
      statusText.innerText = "Cargando prenda...";

      currentGarmentImg.crossOrigin = "anonymous";
      currentGarmentImg.src = imgFileName; // Ruta directa

      currentGarmentImg.onload = function() {
        garmentLoaded = true;
        statusText.innerText = "Realidad Aumentada activa";
      };

      currentGarmentImg.onerror = function() {
        statusText.innerText = "Error: No se encontró la imagen '" + imgFileName + "'";
      };
    }

    // Cargar prenda por defecto al iniciar
    selectGarment('hoodie.png', document.querySelector('.catalog-card'));

    // Procesar seguimiento de MediaPipe con Hombros y Caderas
    function onPoseResults(results) {
      canvasElement.width = videoElement.videoWidth || 640;
      canvasElement.height = videoElement.videoHeight || 480;

      canvasCtx.save();
      canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);

      // Dibujar el video de la cámara
      canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);

      if (results.poseLandmarks && garmentLoaded) {
        const landmarks = results.poseLandmarks;
        
        // Puntos de Hombros (11 y 12) y Caderas (23 y 24)
        const leftShoulder = landmarks[11];
        const rightShoulder = landmarks[12];
        const leftHip = landmarks[23];
        const rightHip = landmarks[24];

        if (leftShoulder.visibility > 0.4 && rightShoulder.visibility > 0.4) {
          const canvasW = canvasElement.width;
          const canvasH = canvasElement.height;

          const x1 = leftShoulder.x * canvasW;
          const y1 = leftShoulder.y * canvasH;
          const x2 = rightShoulder.x * canvasW;
          const y2 = rightShoulder.y * canvasH;

          const shoulderWidth = Math.hypot(x2 - x1, y2 - y1);
          const midX = (x1 + x2) / 2;
          const midY = (y1 + y2) / 2;

          const garmentWidth = shoulderWidth * 2.1;

          // Altura dinámica basada en la distancia del torso (si se detectan caderas)
          let garmentHeight;
          if (leftHip.visibility > 0.3 && rightHip.visibility > 0.3) {
            const hipX = ((leftHip.x + rightHip.x) / 2) * canvasW;
            const hipY = ((leftHip.y + rightHip.y) / 2) * canvasH;
            const torsoLength = Math.hypot(hipX - midX, hipY - midY);
            garmentHeight = torsoLength * 1.4;
          } else {
            const aspectRatio = currentGarmentImg.height / currentGarmentImg.width;
            garmentHeight = garmentWidth * aspectRatio;
          }

          const angle = Math.atan2(y2 - y1, x2 - x1);

          canvasCtx.save();
          
          // Posicionamiento en el punto medio con el ajuste exacto (0.05)
          canvasCtx.translate(midX, midY + (garmentHeight * 0.05)); 
          canvasCtx.rotate(angle);
          canvasCtx.rotate(Math.PI); // Mantener orientada la prenda correctamente

          canvasCtx.drawImage(
            currentGarmentImg, 
            -garmentWidth / 2, 
            -garmentHeight * 0.25, 
            garmentWidth, 
            garmentHeight
          );

          canvasCtx.restore();
        }
      }
      canvasCtx.restore();
    }

    // Inicializar MediaPipe Pose
    const pose = new Pose({
      locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}`
    });

    pose.setOptions({
      modelComplexity: 1,
      smoothLandmarks: true,
      enableSegmentation: false,
      minDetectionConfidence: 0.5,
      minTrackingConfidence: 0.5
    });

    pose.onResults(onPoseResults);

    // Activar la cámara
    const camera = new Camera(videoElement, {
      onFrame: async () => {
        await pose.send({ image: videoElement });
      },
      width: 640,
      height: 480
    });

    camera.start()
      .then(() => {
        statusText.innerText = "Alinea tus hombros a la cámara";
      })
      .catch(err => {
        statusText.innerText = "Error al acceder a la cámara";
        console.error(err);
      });
  </script>
</body>
</html>
