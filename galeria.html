<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Galería de Fotos - Pantalla Completa</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-950 text-slate-100 h-screen flex flex-col font-sans overflow-hidden">

  <!-- Header / Barra Superior -->
  <header class="bg-slate-900/80 backdrop-blur-md border-b border-slate-800 shrink-0 z-50">
    <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <a href="index.html" class="p-2 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 transition-colors">
          <i class="fa-solid fa-arrow-left"></i>
        </a>
        <h1 class="text-lg font-bold bg-gradient-to-r from-cyan-400 to-blue-500 bg-clip-text text-transparent">
          Galería de Fotos
        </h1>
      </div>
      <span class="text-xs text-slate-400 bg-slate-800 border border-slate-700 px-3 py-1 rounded-full font-mono" id="counterBadge">
        0 / 0 Fotos
      </span>
    </div>
  </header>

  <!-- SECCIÓN SUPERIOR: Título y Descripción de la Foto -->
  <section class="bg-slate-900/50 border-b border-slate-800/80 px-4 py-3 shrink-0 text-center sm:text-left">
    <div class="max-w-5xl mx-auto">
      <h2 id="photoTitle" class="text-lg sm:text-xl font-bold text-white mb-0.5 drop-shadow"></h2>
      <p id="photoDesc" class="text-xs sm:text-sm text-slate-300 max-w-3xl drop-shadow-sm leading-relaxed"></p>
    </div>
  </section>

  <!-- Visor Principal Pantalla Completa -->
  <main class="relative flex-1 w-full flex items-center justify-center p-2 sm:p-4 bg-slate-950 overflow-hidden group">
    
    <!-- Imagen a tamaño completo -->
    <img id="mainImage" src="" alt="Foto" class="max-w-full max-h-full object-contain drop-shadow-2xl transition-all duration-300">

    <!-- Botón Anterior -->
    <button id="prevBtn" onclick="changeSlide(-1)" class="absolute left-4 top-1/2 -translate-y-1/2 bg-slate-900/80 hover:bg-cyan-500 hover:text-slate-950 text-white p-4 rounded-full backdrop-blur-md transition-all border border-slate-700/50 shadow-2xl group-hover:opacity-100 opacity-80">
      <i class="fa-solid fa-chevron-left text-xl"></i>
    </button>

    <!-- Botón Siguiente -->
    <button id="nextBtn" onclick="changeSlide(1)" class="absolute right-4 top-1/2 -translate-y-1/2 bg-slate-900/80 hover:bg-cyan-500 hover:text-slate-950 text-white p-4 rounded-full backdrop-blur-md transition-all border border-slate-700/50 shadow-2xl group-hover:opacity-100 opacity-80">
      <i class="fa-solid fa-chevron-right text-xl"></i>
    </button>
  </main>

  <script>
    // LISTA DE IMÁGENES EN TU CARPETA img/
    const images = [
      {
        filename: 'stiker.jpg',
        title: 'Stiker transparente',
        desc: 'Imagen con el nombre y tiempo de cada corredor.'
      },
      {
        filename: 'render1.jpeg',
        title: 'Vista aerea',
        desc: 'Render aereo del modelo 3D.'
      },
      {
        filename: 'render2.jpeg',
        title: 'Vista frontal',
        desc: 'Render Frontal del modelo 3D.'
      },
      {
        filename: 'vueltas.png',
        title: 'Crono y Carrera',
        desc: 'Captura de pantalla de los resultados de tiempo.'
      },
      {
        filename: 'casa1.png',
        title: 'Plano General',
        desc: 'Distribución espacial y estructura del proyecto.'
      }
    ];

    let currentIndex = 0;

    const mainImage = document.getElementById('mainImage');
    const photoTitle = document.getElementById('photoTitle');
    const photoDesc = document.getElementById('photoDesc');
    const counterBadge = document.getElementById('counterBadge');

    function updateSlide() {
      if (images.length === 0) return;
      const current = images[currentIndex];
      
      mainImage.src = `img/${current.filename}`;
      photoTitle.textContent = current.title;
      photoDesc.textContent = current.desc;
      counterBadge.textContent = `${currentIndex + 1} / ${images.length}`;
    }

    function changeSlide(direction) {
      currentIndex = (currentIndex + direction + images.length) % images.length;
      updateSlide();
    }

    // Navegación con teclado
    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowLeft') changeSlide(-1);
      if (e.key === 'ArrowRight') changeSlide(1);
    });

    // Iniciar
    updateSlide();
  </script>
</body>
</html>
