<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Visor 3D Casa</title>

  <!-- Evita el error 404 del favicon -->
  <link rel="icon" href="data:,">

  <!-- Componente model-viewer de Google -->
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #121212;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      user-select: none;
    }

    /* Visor 3D a pantalla completa */
    model-viewer {
      width: 100vw;
      height: 100vh;
      --poster-color: transparent;
      outline: none;
    }

    /* Porcentaje de carga posicionado en la PARTE SUPERIOR IZQUIERDA */
    .loading-percentage {
      position: absolute;
      top: 20px;
      left: 20px;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      color: #ff6b00;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.5px;
      padding: 8px 16px;
      border-radius: 20px;
      border: 1px solid rgba(255, 107, 0, 0.4);
      z-index: 30;
      transition: opacity 0.4s ease, visibility 0.4s ease;
      pointer-events: none;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
    }

    .loading-percentage.hidden {
      opacity: 0;
      visibility: hidden;
    }

    /* Tarjeta superior con instrucciones de uso */
    .info-card {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(18, 18, 18, 0.35);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      color: #ffffff;
      padding: 14px 24px;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      z-index: 20;
      max-width: 90vw;
      width: 620px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      pointer-events: auto;
    }

    .info-card h1 {
      font-size: 14px;
      font-weight: 800;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #ff6b00;
      text-align: center;
      margin-bottom: 10px;
    }

    .info-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    .info-section h2 {
      font-size: 11px;
      font-weight: 700;
      color: rgba(255, 255, 255, 0.6);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 6px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding-bottom: 3px;
    }

    .info-list {
      list-style: none;
      font-size: 11px;
      line-height: 1.6;
      color: rgba(255, 255, 255, 0.9);
    }

    .info-list span.key {
      background: rgba(255, 255, 255, 0.15);
      color: #fff;
      padding: 1px 5px;
      border-radius: 4px;
      font-family: monospace;
      font-weight: 600;
    }

    /* Adaptación para pantallas pequeñas (Móviles) */
    @media (max-width: 600px) {
      .info-card {
        top: 65px;
        width: 92vw;
        padding: 12px 16px;
      }

      .info-grid {
        grid-template-columns: 1fr;
        gap: 10px;
      }

      .loading-percentage {
        top: 15px;
        left: 15px;
        padding: 6px 12px;
        font-size: 12px;
      }
    }
  </style>
</head>
<body>

  <!-- Porcentaje de carga en la parte superior izquierda -->
  <div id="progress-text" class="loading-percentage">
    Cargando 0%
  </div>

  <!-- Tarjeta informativa de controles -->
  <div class="info-card">
    <div class="info-grid">
      <!-- Controles para Pantalla Táctil -->
      <div class="info-section">
        <ul class="info-list">
          <li><strong>2 Dedos (Arrastrar)</strong> : Mover de posición</li>
          <li><strong>1 Dedo (Arrastrar)</strong> : Girar alrededor</li>
          <li><strong>Pellizcar (Pinch)</strong> : Zoom (Acercar/Alejar)</li>
        </ul>
      </div>

    </div>
  </div>

  <!-- Visor 3D interactivo -->
  <model-viewer 
    id="visor-3d"
    src="./modelplano.glb" 
    alt="Modelo 3D Casa" 
    camera-controls 
    shadow-intensity="1" 
    shadow-softness="0.8"
    exposure="1"
    environment-image="neutral"
    touch-action="pan-y">
  </model-viewer>

  <script>
    const viewer = document.querySelector('#visor-3d');
    const progressText = document.querySelector('#progress-text');

    // Estado inicial de la cámara
    const defaultTarget = { x: 0, y: 1.2, z: 0 };
    const defaultOrbit = { theta: 0, phi: 75, radius: 8 };

    let target = { ...defaultTarget };
    let orbit = { ...defaultOrbit };

    const keysPressed = {};
    const MOVE_SPEED = 0.15;
    const ROTATE_SPEED = 2;

    // Actualiza el porcentaje de carga
    viewer.addEventListener('progress', (event) => {
      const percentage = Math.round(event.detail.totalProgress * 100);
      if (progressText) {
        progressText.textContent = `Cargando ${percentage}%`;
      }
    });

    // Oculta el porcentaje cuando se completa la descarga
    viewer.addEventListener('load', () => {
      if (progressText) {
        progressText.classList.add('hidden');
      }
    });

    // Eventos de teclado
    window.addEventListener('keydown', (e) => {
      keysPressed[e.code] = true;
      if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.code)) {
        if (document.activeElement === document.body || document.activeElement === viewer) {
          e.preventDefault();
        }
      }
    });

    window.addEventListener('keyup', (e) => {
      keysPressed[e.code] = false;
    });

    // Bucle de actualización continua para la navegación fluida por teclado
    function updateMovement() {
      let moved = false;

      // Obtener el ángulo horizontal actual de la cámara (convertido a radianes)
      let currentThetaRad = (orbit.theta * Math.PI) / 180;

      // Movimiento hacia adelante / atrás (W / S / Flecha Arriba / Flecha Abajo)
      if (keysPressed['KeyW'] || keysPressed['ArrowUp']) {
        target.x -= Math.sin(currentThetaRad) * MOVE_SPEED;
        target.z -= Math.cos(currentThetaRad) * MOVE_SPEED;
        moved = true;
      }
      if (keysPressed['KeyS'] || keysPressed['ArrowDown']) {
        target.x += Math.sin(currentThetaRad) * MOVE_SPEED;
        target.z += Math.cos(currentThetaRad) * MOVE_SPEED;
        moved = true;
      }

      // Movimiento lateral (A / D / Flecha Izquierda / Flecha Derecha)
      if (keysPressed['KeyA'] || keysPressed['ArrowLeft']) {
        target.x -= Math.cos(currentThetaRad) * MOVE_SPEED;
        target.z += Math.sin(currentThetaRad) * MOVE_SPEED;
        moved = true;
      }
      if (keysPressed['KeyD'] || keysPressed['ArrowRight']) {
        target.x += Math.cos(currentThetaRad) * MOVE_SPEED;
        target.z -= Math.sin(currentThetaRad) * MOVE_SPEED;
        moved = true;
      }

      // Control de altura (Espacio para subir / Shift para bajar)
      if (keysPressed['Space']) {
        target.y += MOVE_SPEED;
        moved = true;
      }
      if (keysPressed['ShiftLeft'] || keysPressed['ShiftRight']) {
        target.y = Math.max(0, target.y - MOVE_SPEED);
        moved = true;
      }

      // Rotación de cámara por teclado (Q / E)
      if (keysPressed['KeyQ']) {
        orbit.theta -= ROTATE_SPEED;
        moved = true;
      }
      if (keysPressed['KeyE']) {
        orbit.theta += ROTATE_SPEED;
        moved = true;
      }

      // Restablecer posición (Tecla R)
      if (keysPressed['KeyR']) {
        target = { ...defaultTarget };
        orbit = { ...defaultOrbit };
        moved = true;
      }

      // Aplicar cambios al visor si se presionó alguna tecla
      if (moved) {
        viewer.cameraTarget = `${target.x.toFixed(2)}m ${target.y.toFixed(2)}m ${target.z.toFixed(2)}m`;
        viewer.cameraOrbit = `${orbit.theta.toFixed(1)}deg ${orbit.phi.toFixed(1)}deg ${orbit.radius.toFixed(1)}m`;
      }

      requestAnimationFrame(updateMovement);
    }

    // Iniciar animación de controles
    requestAnimationFrame(updateMovement);
  </script>

</body>
</html>
