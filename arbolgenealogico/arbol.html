<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jardin Genealogico Familiar</title>
    <!-- Carga de D3.js -->
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        :root {
            --primary: #15803d;
            --primary-hover: #166534;
            --bg-color: #f0fdf4;
            --card-bg: #ffffff;
            --text-color: #1e293b;
            --border-color: #bbf7d0;
            --accent: #b45309;
            --selected: #047857;
            --branch-color: #a3e635;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* Panel lateral estilo vivero */
        .sidebar {
            width: 400px;
            background-color: var(--card-bg);
            border-right: 1px solid var(--border-color);
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            box-shadow: 4px 0 15px rgba(21, 128, 61, 0.05);
            z-index: 10;
            overflow-y: auto;
        }

        h2 {
            font-size: 1.1rem;
            color: var(--primary);
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 6px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
            margin-bottom: 10px;
        }

        label {
            font-size: 0.8rem;
            font-weight: 600;
            color: #475569;
        }

        input, select {
            padding: 8px 10px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 0.9rem;
            outline: none;
            transition: border-color 0.2s;
            background-color: #fafaf9;
        }

        input:focus, select:focus {
            border-color: var(--primary);
            background-color: #ffffff;
        }

        .btn-group {
            display: flex;
            gap: 8px;
            margin-top: 5px;
        }

        button {
            padding: 9px 12px;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            transition: background-color 0.2s;
            width: 100%;
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        button.btn-secondary {
            background-color: #64748b;
        }
        button.btn-secondary:hover {
            background-color: #475569;
        }

        button.btn-success {
            background-color: #047857;
        }
        button.btn-success:hover {
            background-color: #065f46;
        }

        button.btn-danger {
            background-color: #dc2626;
        }
        button.btn-danger:hover {
            background-color: #b91c1c;
        }

        /* Tarjeta de seleccion de rama */
        .selection-card {
            background-color: #f7fee7;
            border: 1px solid #d9f99d;
            padding: 12px;
            border-radius: 6px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .selection-card header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .selection-card h3 {
            font-size: 0.95rem;
            color: #365314;
        }

        /* Area de visualizacion tipo Jardin */
        .main-content {
            flex: 1;
            position: relative;
            background: linear-gradient(180deg, #bae6fd 0%, #e0f2fe 50%, #dcfce7 100%);
        }

        #tree-container {
            width: 100%;
            height: 100%;
        }

        /* Estilos de las hojas y brotes del arbol */
        .node circle {
            fill: #ffffff;
            stroke: #16a34a;
            stroke-width: 4px;
            cursor: pointer;
            transition: all 0.3s ease;
            filter: drop-shadow(0px 3px 4px rgba(0,0,0,0.15));
        }

        .node circle:hover {
            stroke: #047857;
            stroke-width: 6px;
            fill: #f0fdf4;
        }

        .node text {
            font-size: 12px;
            font-weight: 700;
            fill: #14532d;
            pointer-events: none;
            text-shadow: 0 1px 2px rgba(255,255,255,0.8);
        }

        .node .couple-text {
            fill: #9a3412;
            font-size: 11px;
            font-weight: 600;
        }

        .node .phone-text {
            fill: #047857;
            font-size: 10px;
        }

        .node--selected circle {
            fill: #bbf7d0 !important;
            stroke: #047857 !important;
            stroke-width: 6px !important;
            r: 12 !important;
        }

        .node--highlight circle {
            fill: #fef08a !important;
            stroke: #ca8a04 !important;
            stroke-width: 6px !important;
            r: 12 !important;
        }

        /* Ramas organicas del arbol */
        .link {
            fill: none;
            stroke: #78350f;
            stroke-width: 4px;
            stroke-linecap: round;
            opacity: 0.85;
        }

        .instructions {
            position: absolute;
            bottom: 20px;
            right: 20px;
            background: rgba(255, 255, 255, 0.9);
            padding: 10px 15px;
            border-radius: 8px;
            font-size: 0.8rem;
            border: 1px solid var(--border-color);
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            pointer-events: none;
            color: #334155;
        }
    </style>
</head>
<body>

    <div class="sidebar">
        <!-- Busqueda -->
        <section>
            <h2>Buscar en el Jardin</h2>
            <div class="form-group" style="margin-top: 8px;">
                <input type="text" id="search-input" placeholder="Nombre, pareja o telefono..." oninput="buscarPersona()">
            </div>
        </section>

        <!-- Panel de Rama Seleccionada -->
        <section id="selection-panel" style="display: none;">
            <div class="selection-card">
                <header>
                    <h3 id="selected-name">Rama Seleccionada</h3>
                    <button class="btn-danger" style="width: auto; padding: 2px 8px; font-size: 0.75rem;" onclick="deseleccionarNode()">Cerrar</button>
                </header>
                <div class="btn-group">
                    <button class="btn-success" onclick="prepararAgregarHijo()">Crear Nuevo Brote (Hijo)</button>
                    <button class="btn-secondary" onclick="cargarEnFormularioEdicion()">Modificar Rama</button>
                    <button class="btn-danger" onclick="eliminarPersona()">Podar (Eliminar)</button>
                </div>
            </div>
        </section>

        <!-- Formulario de Cultivo -->
        <section>
            <h2 id="form-title">Registrar Nueva Rama</h2>
            <form id="person-form" onsubmit="guardarPersona(event)">
                <input type="hidden" id="edit-id" value="">

                <div class="form-group">
                    <label for="padre-select">Rama Progenitora</label>
                    <select id="padre-select" onchange="evaluarModoFormulario()">
                        <!-- Opciones dinamicas -->
                    </select>
                </div>

                <div class="form-group">
                    <label for="nombre">Nombre Completo *</label>
                    <input type="text" id="nombre" required placeholder="Ej. Juan Perez">
                </div>

                <div class="form-group">
                    <label for="fecha-nacimiento">Fecha de Nacimiento *</label>
                    <input type="date" id="fecha-nacimiento" required>
                </div>

                <div class="form-group">
                    <label for="telefono">Numero de Telefono</label>
                    <input type="tel" id="telefono" placeholder="Ej. 55 1234 5678">
                </div>

                <div class="form-group">
                    <label for="pareja">Pareja o Conyuge (Opcional)</label>
                    <input type="text" id="pareja" placeholder="Ej. Maria Lopez">
                </div>

                <div class="btn-group">
                    <button type="submit" id="submit-btn">Plantar en el Arbol</button>
                    <button type="button" id="cancel-edit-btn" class="btn-secondary" style="display: none;" onclick="cancelarEdicion()">Cancelar</button>
                </div>
            </form>
        </section>
    </div>

    <div class="main-content">
        <div id="tree-container"></div>
        <div class="instructions">
            Nota: Haz clic sobre cualquier hoja del arbol para seleccionarla, modificarla, podarla o extender nuevas ramificaciones.
        </div>
    </div>

    <script>
        // CONFIGURACION DE GITHUB (Sustituye con tus datos reales)
        const CONFIG_GITHUB = {
            user: lugi2050-dotcom,
            repo: carrera-nfc,
            token: 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
        };

        let personas = [];
        let idCounter = 1;
        let selectedNodeId = null;
        let fileSha = null;

        const container = document.getElementById('tree-container');
        const svg = d3.select("#tree-container").append("svg")
            .attr("width", "100%")
            .attr("height", "100%")
            .call(d3.zoom().on("zoom", (event) => {
                g.attr("transform", event.transform);
            }))
            .append("g");

        const g = svg.append("g").attr("transform", "translate(80,0)");
        const treeLayout = d3.tree().nodeSize([95, 250]);

        async function cargarDatosDesdeGitHub() {
            const { user, repo, token } = CONFIG_GITHUB;

            if (!user || user === lugi2050-dotcom || !repo || !token) {
                cargarDatosLocalesPrueba();
                return;
            }

            try {
                const response = await fetch(`https://api.github.com/repos/${user}/${repo}/contents/datos.json`, {
                    headers: {
                        'Authorization': `token ${token}`,
                        'Accept': 'application/vnd.github.v3+json'
                    }
                });

                if (response.status === 404) {
                    await inicializarArchivoEnGitHub(user, repo, token);
                    return;
                }

                if (!response.ok) throw new Error("No se pudo obtener el archivo datos.json del repositorio.");

                const data = await response.json();
                fileSha = data.sha;

                const cleanBase64 = data.content.replace(/\s/g, '');
                const jsonString = new TextDecoder().decode(Uint8Array.from(atob(cleanBase64), c => c.charCodeAt(0)));
                const parsedData = JSON.parse(jsonString);

                if (Array.isArray(parsedData)) {
                    personas = parsedData;
                    idCounter = personas.length > 0 ? Math.max(...personas.map(p => p.id)) + 1 : 1;
                } else {
                    personas = parsedData.personas || [];
                    idCounter = parsedData.idCounter || (personas.length > 0 ? Math.max(...personas.map(p => p.id)) + 1 : 1);
                }

                actualizarSelectorPadres();
                renderizarArbol();
            } catch (error) {
                console.error(error);
                alert("Error al conectar con GitHub. Se cargaran datos locales de prueba.");
                cargarDatosLocalesPrueba();
            }
        }

        async function inicializarArchivoEnGitHub(user, repo, token) {
            personas = [
                { id: 1, nombre: "Roberto Gomez", fechaNacimiento: "1950-05-20", telefono: "555-123-4567", pareja: "Elena Ramos", padreId: null },
                { id: 2, nombre: "Carlos Gomez", fechaNacimiento: "1978-11-12", telefono: "555-987-6543", pareja: "Laura Torres", padreId: 1 }
            ];
            idCounter = 3;

            const contenidoObjeto = { personas, idCounter };
            const contentEncoded = btoa(unescape(encodeURIComponent(JSON.stringify(contenidoObjeto, null, 4))));

            try {
                const response = await fetch(`https://api.github.com/repos/${user}/${repo}/contents/datos.json`, {
                    method: 'PUT',
                    headers: {
                        'Authorization': `token ${token}`,
                        'Accept': 'application/vnd.github.v3+json',
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        message: "Creacion inicial automatica de datos.json",
                        content: contentEncoded
                    })
                });

                if (response.ok) {
                    const data = await response.json();
                    fileSha = data.content.sha;
                }
            } catch (e) {
                console.error("Error al inicializar el archivo en GitHub:", e);
            }

            actualizarSelectorPadres();
            renderizarArbol();
        }

        function cargarDatosLocalesPrueba() {
            personas = [
                { id: 1, nombre: "Roberto Gomez", fechaNacimiento: "1950-05-20", telefono: "555-123-4567", pareja: "Elena Ramos", padreId: null },
                { id: 2, nombre: "Carlos Gomez", fechaNacimiento: "1978-11-12", telefono: "555-987-6543", pareja: "Laura Torres", padreId: 1 }
            ];
            idCounter = 3;
            actualizarSelectorPadres();
            renderizarArbol();
        }

        async function persistirDatosEnGitHub() {
            const { user, repo, token } = CONFIG_GITHUB;

            if (!user || user === "TU_USUARIO_AQUI" || !repo || !token) {
                alert("Faltan configurar las credenciales de GitHub en el codigo fuente.");
                return;
            }

            const contenidoObjeto = {
                personas: personas,
                idCounter: idCounter
            };

            const contentEncoded = btoa(unescape(encodeURIComponent(JSON.stringify(contenidoObjeto, null, 4))));

            try {
                const response = await fetch(`https://api.github.com/repos/${user}/${repo}/contents/datos.json`, {
                    method: 'PUT',
                    headers: {
                        'Authorization': `token ${token}`,
                        'Accept': 'application/vnd.github.v3+json',
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        message: "Actualizacion de ramas y hojas del arbol",
                        content: contentEncoded,
                        sha: fileSha
                    })
                });

                if (!response.ok) {
                    const errData = await response.json();
                    throw new Error(errData.message || "Error al actualizar el archivo en GitHub.");
                }

                const responseData = await response.json();
                fileSha = responseData.content.sha;
            } catch (error) {
                console.error(error);
                alert("Error al guardar en GitHub: " + error.message);
            }
        }

        function seleccionarNodo(id) {
            selectedNodeId = id;
            const persona = personas.find(p => p.id === id);
            
            if (persona) {
                document.getElementById('selection-panel').style.display = 'block';
                document.getElementById('selected-name').textContent = persona.nombre;
            } else {
                deseleccionarNode();
            }

            renderizarArbol();
        }

        function deseleccionarNode() {
            selectedNodeId = null;
            document.getElementById('selection-panel').style.display = 'none';
            renderizarArbol();
        }

        function prepararAgregarHijo() {
            if (!selectedNodeId) return;
            document.getElementById('edit-id').value = "";
            document.getElementById('padre-select').value = selectedNodeId;
            document.getElementById('nombre').focus();
            evaluarModoFormulario();
        }

        function cargarEnFormularioEdicion() {
            if (!selectedNodeId) return;
            const persona = personas.find(p => p.id === selectedNodeId);
            if (!persona) return;

            document.getElementById('edit-id').value = persona.id;
            document.getElementById('nombre').value = persona.nombre;
            document.getElementById('fecha-nacimiento').value = persona.fechaNacimiento;
            document.getElementById('telefono').value = persona.telefono || '';
            document.getElementById('pareja').value = persona.pareja || '';
            document.getElementById('padre-select').value = persona.padreId || '';

            evaluarModoFormulario();
        }

        function cancelarEdicion() {
            document.getElementById('edit-id').value = "";
            document.getElementById('person-form').reset();
            evaluarModoFormulario();
        }

        function evaluarModoFormulario() {
            const editId = document.getElementById('edit-id').value;
            const select = document.getElementById('padre-select');
            const submitBtn = document.getElementById('submit-btn');
            const cancelBtn = document.getElementById('cancel-edit-btn');
            const formTitle = document.getElementById('form-title');

            if (editId) {
                formTitle.textContent = "Modificar Rama";
                submitBtn.textContent = "Guardar Cambios";
                submitBtn.className = "btn-success";
                cancelBtn.style.display = "block";
            } else {
                formTitle.textContent = "Registrar Nueva Rama";
                submitBtn.className = "";
                cancelBtn.style.display = "none";
                if (select.value === "") {
                    submitBtn.textContent = "Establecer Tronco Principal (Raiz)";
                } else {
                    submitBtn.textContent = "Plantar en el Arbol";
                }
            }
        }

        function guardarPersona(e) {
            e.preventDefault();

            const editId = document.getElementById('edit-id').value;
            const nombre = document.getElementById('nombre').value.trim();
            const fecha = document.getElementById('fecha-nacimiento').value;
            const telefono = document.getElementById('telefono').value.trim();
            const pareja = document.getElementById('pareja').value.trim();
            const padreId = document.getElementById('padre-select').value;

            if (editId) {
                const persona = personas.find(p => p.id === parseInt(editId));
                if (persona) {
                    if (padreId && parseInt(padreId) === persona.id) {
                        alert("Una rama no puede sostenerse a si misma.");
                        return;
                    }
                    persona.nombre = nombre;
                    persona.fechaNacimiento = fecha;
                    persona.telefono = telefono || null;
                    persona.pareja = pareja || null;
                    persona.padreId = padreId ? parseInt(padreId) : null;
                }
            } else {
                if (padreId === "" && personas.length > 0) {
                    if (!confirm("Ya existe un tronco principal. Deseas reiniciar y establecer esta persona como el nuevo inicio?")) {
                        return;
                    }
                    personas = [];
                    deseleccionarNode();
                }

                const nuevaPersona = {
                    id: idCounter++,
                    nombre: nombre,
                    fechaNacimiento: fecha,
                    telefono: telefono || null,
                    pareja: pareja || null,
                    padreId: padreId ? parseInt(padreId) : null
                };

                personas.push(nuevaPersona);
            }

            persistirDatosEnGitHub();
            cancelarEdicion();
            actualizarSelectorPadres();
            renderizarArbol();
        }

        function eliminarPersona() {
            if (!selectedNodeId) return;
            
            const tieneHijos = personas.some(p => p.padreId === selectedNodeId);
            if (tieneHijos) {
                alert("No se puede podar una rama que tiene ramificaciones secundarias. Elimine primero los brotes hijos.");
                return;
            }

            if (confirm("Estas seguro de podar y eliminar esta rama del arbol?")) {
                personas = personas.filter(p => p.id !== selectedNodeId);
                persistirDatosEnGitHub();
                deseleccionarNode();
                actualizarSelectorPadres();
                renderizarArbol();
            }
        }

        function actualizarSelectorPadres() {
            const select = document.getElementById('padre-select');
            const valorPrevio = select.value;
            select.innerHTML = '';

            if (personas.length === 0) {
                const opt = document.createElement('option');
                opt.value = "";
                opt.textContent = "Establecer Tronco Principal (Raiz)";
                select.appendChild(opt);
            } else {
                const optRaiz = document.createElement('option');
                optRaiz.value = "";
                optRaiz.textContent = "Sin Rama Progenitora / Nuevo Tronco";
                select.appendChild(optRaiz);

                personas.forEach(p => {
                    const opt = document.createElement('option');
                    opt.value = p.id;
                    opt.textContent = `Rama de: ${p.nombre}` + (p.pareja ? ` y ${p.pareja}` : '');
                    select.appendChild(opt);
                });

                select.value = valorPrevio || (personas.length > 0 ? personas[0].id : "");
            }
            evaluarModoFormulario();
        }

        function estructurarDatos() {
            if (personas.length === 0) return null;

            const mapa = {};
            personas.forEach(p => mapa[p.id] = { ...p, children: [] });

            let raiz = null;

            personas.forEach(p => {
                if (p.padreId && mapa[p.padreId]) {
                    mapa[p.padreId].children.push(mapa[p.id]);
                } else if (!raiz) {
                    raiz = mapa[p.id];
                }
            });

            return raiz ? d3.hierarchy(raiz) : null;
        }

        function renderizarArbol() {
            g.selectAll("*").remove();

            const dataJerarquica = estructurarDatos();
            if (!dataJerarquica) return;

            const root = treeLayout(dataJerarquica);

            g.selectAll(".link")
                .data(root.links())
                .enter().append("path")
                .attr("class", "link")
                .attr("d", d3.linkHorizontal()
                    .x(d => d.y)
                    .y(d => d.x));

            const node = g.selectAll(".node")
                .data(root.descendants())
                .enter().append("g")
                .attr("class", d => {
                    let cls = `node node-id-${d.data.id}`;
                    if (d.data.id === selectedNodeId) cls += ' node--selected';
                    return cls;
                })
                .attr("transform", d => `translate(${d.y},${d.x})`)
                .on("click", (event, d) => {
                    event.stopPropagation();
                    seleccionarNodo(d.data.id);
                });

            node.append("circle").attr("r", 9);

            node.append("text")
                .attr("dy", "-0.8em")
                .attr("x", 14)
                .text(d => d.data.nombre);

            node.append("text")
                .attr("class", "couple-text")
                .attr("dy", "0.4em")
                .attr("x", 14)
                .text(d => d.data.pareja ? `Pareja: ${d.data.pareja}` : '');

            node.append("text")
                .attr("class", "phone-text")
                .attr("dy", "1.6em")
                .attr("x", 14)
                .text(d => d.data.telefono ? `Tel: ${d.data.telefono}` : '');

            node.append("text")
                .attr("dy", "2.8em")
                .attr("x", 14)
                .style("fill", "#475569")
                .style("font-size", "10px")
                .text(d => d.data.fechaNacimiento ? `Nac: ${d.data.fechaNacimiento}` : '');
        }

        function buscarPersona() {
            const query = document.getElementById('search-input').value.toLowerCase().trim();
            d3.selectAll('.node').classed('node--highlight', false);

            if (query === '') return;

            const coincidentes = personas.filter(p => 
                p.nombre.toLowerCase().includes(query) || 
                (p.pareja && p.pareja.toLowerCase().includes(query)) ||
                (p.telefono && p.telefono.includes(query))
            );

            coincidentes.getResource = coincidentes;
            coincidentes.forEach(p => {
                d3.selectAll(`.node-id-${p.id}`).classed('node--highlight', true);
            });
        }

        window.onload = () => {
            cargarDatosDesdeGitHub();
        };
    </script>
</body>
</html>
