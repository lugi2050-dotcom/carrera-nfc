<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Árbol Genealógico - lugi2050-dotcom/carrera-nfc</title>
  <style>
    :root {
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --border: #cbd5e1;
      --primary: #2563eb;
      --text: #1e293b;
      --line: #94a3b8;
    }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 20px;
    }

    header {
      text-align: center;
      max-width: 1200px;
      margin: 0 auto 30px auto;
      padding-bottom: 15px;
      border-bottom: 2px solid var(--border);
    }

    header h1 {
      margin: 0 0 5px 0;
      font-size: 1.8em;
    }

    header p {
      margin: 0;
      color: #64748b;
      font-size: 0.9em;
    }

    /* Estructura del Árbol Genealógico Jerárquico */
    .tree-container {
      overflow-x: auto;
      padding: 20px 0;
      display: flex;
      justify-content: center;
    }

    .tree, .tree ul {
      padding-top: 20px;
      position: relative;
      transition: all 0.5s;
      display: flex;
      justify-content: center;
    }

    .tree li {
      float: left; 
      text-align: center;
      list-style-type: none;
      position: relative;
      padding: 20px 5px 0 5px;
      transition: all 0.5s;
    }

    /* Conectores / Líneas de parentesco */
    .tree li::before, .tree li::after {
      content: '';
      position: absolute; 
      top: 0; 
      right: 50%;
      border-top: 2px solid var(--line);
      width: 50%; 
      height: 20px;
    }
    .tree li::after {
      right: auto; 
      left: 50%;
      border-left: 2px solid var(--line);
    }

    .tree li:only-child::after, .tree li:only-child::before { display: none; }
    .tree li:only-child { padding-top: 0; }
    .tree li:first-child::before, .tree li:last-child::after { border: none; }
    .tree li:last-child::before { border-right: 2px solid var(--line); border-radius: 0 5px 0 0; }
    .tree li:first-child::after { border-radius: 5px 0 0 0; }

    .tree ul::before {
      content: '';
      position: absolute; 
      top: 0; 
      left: 50%;
      border-left: 2px solid var(--line);
      width: 0; 
      height: 20px;
    }

    /* Tarjeta de Persona */
    .person-card {
      border: 2px solid var(--border);
      padding: 12px 18px;
      background: var(--card-bg);
      border-radius: 8px;
      display: inline-block;
      min-width: 150px;
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05), 0 2px 4px -1px rgba(0,0,0,0.03);
    }

    .person-name { 
      font-weight: bold; 
      font-size: 1.1em; 
      color: var(--text);
    }
    
    .person-details { 
      font-size: 0.85em; 
      color: #64748b; 
      margin-top: 4px; 
    }

    .error-box {
      background: #ffeeef;
      border: 1px solid #f87171;
      color: #b91c1c;
      padding: 20px;
      border-radius: 8px;
      max-width: 500px;
      margin: 40px auto;
      text-align: center;
    }
  </style>
</head>
<body>

  <header>
    <h1>Árbol Genealógico</h1>
    <p>Repositorio: <strong>lugi2050-dotcom/carrera-nfc</strong> (Modo Solo Lectura)</p>
  </header>

  <main>
    <div class="tree-container">
      <div id="tree" class="tree">Cargando árbol genealógico...</div>
    </div>
  </main>

  <script>
    // URL directa al archivo bruto (Raw) en GitHub
    const REPO_OWNER = "lugi2050-dotcom";
    const REPO_NAME = "carrera-nfc";
    const FILE_PATH = "datos.json";

    window.onload = () => {
      loadTreeData();
    };

    async function loadTreeData() {
      // Intentamos primero con la rama 'main', si falla probaremos con 'master'
      let url = `https://raw.githubusercontent.com/${REPO_OWNER}/${REPO_NAME}/main/${FILE_PATH}`;
      
      try {
        let response = await fetch(url);
        if (!response.ok) {
          // Si 'main' da 404, probamos con la rama 'master'
          url = `https://raw.githubusercontent.com/${REPO_OWNER}/${REPO_NAME}/master/${FILE_PATH}`;
          response = await fetch(url);
        }

        if (!response.ok) {
          throw new Error("No se pudo encontrar el archivo datos.json en el repositorio.");
        }

        const treeData = await response.json();
        renderTree(treeData);
      } catch (err) {
        console.error(err);
        document.getElementById('tree').innerHTML = `
          <div class="error-box">
            <h3>⚠️ No se pudo cargar el archivo</h3>
            <p>Asegúrate de que:</p>
            <ul style="text-align: left; display: inline-block; margin-top: 8px;">
              <li>El repositorio <b>carrera-nfc</b> sea <b>público</b>.</li>
              <li>El archivo <b>datos.json</b> exista en la raíz del repositorio.</li>
            </ul>
          </div>
        `;
      }
    }

    function renderTree(treeData) {
      const container = document.getElementById('tree');
      if (!treeData || treeData.length === 0) {
        container.innerHTML = "<p style='color: #64748b;'>El archivo datos.json está vacío.</p>";
        return;
      }

      let html = "<ul>";
      treeData.forEach(node => {
        html += renderNode(node);
      });
      html += "</ul>";
      container.innerHTML = html;
    }

    function renderNode(node) {
      let html = `
        <li>
          <div class="person-card">
            <div class="person-name">${node.name}</div>
            <div class="person-details">${node.birth ? 'Nac: ' + node.birth : ''}</div>
            <div class="person-details">${node.notes || ''}</div>
          </div>
      `;

      if (node.children && node.children.length > 0) {
        html += "<ul>";
        node.children.forEach(child => {
          html += renderNode(child);
        });
        html += "</ul>";
      }

      html += "</li>";
      return html;
    }
  </script>
</body>
</html>
