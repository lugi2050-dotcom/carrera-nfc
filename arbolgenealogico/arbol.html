<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arbol Genealogico Interactivo</title>
    <!-- Carga de D3.js -->
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-color: #1e293b;
            --border-color: #e2e8f0;
            --accent: #ec4899;
            --selected: #10b981;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* Panel lateral */
        .sidebar {
            width: 400px;
            background-color: var(--card-bg);
            border-right: 1px solid var(--border-color);
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            box-shadow: 2px 0 10px rgba(0,0,0,0.05);
            z-index: 10;
            overflow-y: auto;
        }

        h2 {
            font-size: 1.1rem;
            color: var(--primary);
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 6px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
            margin-bottom: 10px;
        }

        label {
            font-size: 0.8rem;
            font-weight: 600;
            color: #64748b;
        }

        input, select {
            padding: 8px 10px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 0.9rem;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus, select:focus {
            border-color: var(--primary);
        }

        .btn-group {
            display: flex;
            gap: 8px;
            margin-top: 5px;
        }

        button {
            padding: 9px 12px;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            transition: background-color 0.2s;
            width: 100%;
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        button.btn-secondary {
            background-color: #64748b;
        }
        button.btn-secondary:hover {
            background-color: #475569;
        }

        button.btn-success {
            background-color: #10b981;
        }
        button.btn-success:hover {
            background-color: #059669;
        }

        button.btn-danger {
            background-color: #ef4444;
        }
        button.btn-danger:hover {
            background-color: #dc2626;
        }

        /* Tarjeta de seleccion */
        .selection-card {
            background-color: #f0fdf4;
            border: 1px solid #bbf7d0;
            padding: 12px;
            border-radius: 6px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .selection-card header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .selection-card h3 {
            font-size: 0.95rem;
            color: #166534;
        }

        /* Area de visualizacion */
        .main-content {
            flex: 1;
            position: relative;
            background-color: #f1f5f9;
        }

        #tree-container {
            width: 100%;
            height: 100%;
        }

        /* Estilos de los nodos */
        .node circle {
            fill: #fff;
            stroke: var(--primary);
            stroke-width: 3px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .node circle:hover {
            stroke: var(--selected);
            stroke-width: 5px;
        }

        .node text {
            font-size: 12px;
            font-weight: 600;
            pointer-events: none;
        }

        .node .couple-text {
            fill: var(--accent);
            font-size: 11px;
            font-weight: 500;
        }

        .node .phone-text {
            fill: #059669;
            font-size: 10px;
        }

        .node--selected circle {
            fill: #a7f3d0 !important;
            stroke: var(--selected) !important;
            stroke-width: 5px !important;
            r: 10 !important;
        }

        .node--highlight circle {
            fill: #fef08a !important;
            stroke: #ca8a04 !important;
            stroke-width: 5px !important;
            r: 10 !important;
        }

        .link {
            fill: none;
            stroke: #cbd5e1;
            stroke-width: 2px;
        }

        .instructions {
            position: absolute;
            bottom: 20px;
            right: 20px;
            background: rgba(255, 255, 255, 0.9);
            padding: 10px 15px;
            border-radius: 8px;
            font-size: 0.8rem;
            border: 1px solid var(--border-color);
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div class="sidebar">
        <!-- Configuracion de GitHub -->
        <section>
            <h2>Conexion con GitHub</h2>
            <div class="form-group" style="margin-top: 8px;">
                <label for="gh-user">Usuario de GitHub</label>
                <input type="text" id="gh-user" placeholder="Ej. tu-usuario">
            </div>
            <div class="form-group">
                <label for="gh-repo">Nombre del Repositorio</label>
                <input type="text" id="gh-repo" placeholder="Ej. arbol-genealogico">
            </div>
            <div class="form-group">
                <label for="gh-token">Token Personal (PAT)</label>
                <input type="password" id="gh-token" placeholder="ghp_xxxxxxxxxxxx">
            </div>
            <button class="btn-success" onclick="guardarConfiguracionGitHub()">Guardar Credenciales y Sincronizar</button>
        </section>

        <!-- Busqueda -->
        <section>
            <h2>Buscar en el Arbol</h2>
            <div class="form-group" style="margin-top: 8px;">
                <input type="text" id="search-input" placeholder="Nombre, pareja o telefono..." oninput="buscarPersona()">
            </div>
        </section>

        <!-- Panel de Nodo Seleccionado -->
        <section id="selection-panel" style="display: none;">
            <div class="selection-card">
                <header>
                    <h3 id="selected-name">Persona Seleccionada</h3>
                    <button class="btn-danger" style="width: auto; padding: 2px 8px; font-size: 0.75rem;" onclick="deseleccionarNode()">Cerrar</button>
                </header>
                <div class="btn-group">
                    <button class="btn-success" onclick="prepararAgregarHijo()">Agregar Hijo</button>
                    <button class="btn-secondary" onclick="cargarEnFormularioEdicion()">Editar Datos</button>
                    <button class="btn-danger" onclick="eliminarPersona()">Eliminar</button>
                </div>
            </div>
        </section>

        <!-- Formulario -->
        <section>
            <h2 id="form-title">Registrar Integrante</h2>
            <form id="person-form" onsubmit="guardarPersona(event)">
                <input type="hidden" id="edit-id" value="">

                <div class="form-group">
                    <label for="padre-select">Progenitor o Padre</label>
                    <select id="padre-select" onchange="evaluarModoFormulario()">
                        <!-- Opciones dinamicas -->
                    </select>
                </div>

                <div class="form-group">
                    <label for="nombre">Nombre Completo *</label>
                    <input type="text" id="nombre" required placeholder="Ej. Juan Perez">
                </div>

                <div class="form-group">
                    <label for="fecha-nacimiento">Fecha de Nacimiento *</label>
                    <input type="date" id="fecha-nacimiento" required>
                </div>

                <div class="form-group">
                    <label for="telefono">Numero de Telefono</label>
                    <input type="tel" id="telefono" placeholder="Ej. 55 1234 5678">
                </div>

                <div class="form-group">
                    <label for="pareja">Pareja o Conyuge (Opcional)</label>
                    <input type="text" id="pareja" placeholder="Ej. Maria Lopez">
                </div>

                <div class="btn-group">
                    <button type="submit" id="submit-btn">Agregar al Arbol</button>
                    <button type="button" id="cancel-edit-btn" class="btn-secondary" style="display: none;" onclick="cancelarEdicion()">Cancelar</button>
                </div>
            </form>
        </section>
    </div>

    <div class="main-content">
        <div id="tree-container"></div>
        <div class="instructions">
            Nota: Al ingresar tus credenciales una vez, se quedan guardadas en este dispositivo para futuras sesiones.
        </div>
    </div>

    <script>
        let personas = [];
        let idCounter = 1;
        let selectedNodeId = null;
        let fileSha = null;

        const container = document.getElementById('tree-container');
        const svg = d3.select("#tree-container").append("svg")
            .attr("width", "100%")
            .attr("height", "100%")
            .call(d3.zoom().on("zoom", (event) => {
                g.attr("transform", event.transform);
            }))
            .append("g");

        const g = svg.append("g").attr("transform", "translate(80,0)");
        const treeLayout = d3.tree().nodeSize([85, 230]);

        // Cargar credenciales guardadas y rellenar los inputs automaticamente
        function cargarCredenciales() {
            const user = localStorage.getItem('gh_user') || '';
            const repo = localStorage.getItem('gh_repo') || '';
            const token = localStorage.getItem('gh_token') || '';

            document.getElementById('gh-user').value = user;
            document.getElementById('gh-repo').value = repo;
            document.getElementById('gh-token').value = token;

            return { user, repo, token };
        }

        function guardarConfiguracionGitHub() {
            const user = document.getElementById('gh-user').value.trim();
            const repo = document.getElementById('gh-repo').value.trim();
            const token = document.getElementById('gh-token').value.trim();

            if (!user || !repo || !token) {
                alert("Por favor completa todos los campos de configuracion de GitHub.");
                return;
            }

            localStorage.setItem('gh_user', user);
            localStorage.setItem('gh_repo', repo);
            localStorage.setItem('gh_token', token);

            alert("Credenciales guardadas con exito. Sincronizando...");
            cargarDatosDesdeGitHub();
        }

        // Cargar datos desde el archivo datos.json en GitHub
        async function cargarDatosDesdeGitHub() {
            const { user, repo, token } = cargarCredenciales();

            if (!user || !repo || !token) {
                // Datos de prueba si aun no se configuran las credenciales
                personas = [
                    { id: 1, nombre: "Roberto Gomez", fechaNacimiento: "1950-05-20", telefono: "555-123-4567", pareja: "Elena Ramos", padreId: null },
                    { id: 2, nombre: "Carlos Gomez", fechaNacimiento: "1978-11-12", telefono: "555-987-6543", pareja: "Laura Torres", padreId: 1 }
                ];
                idCounter = 3;
                actualizarSelectorPadres();
                renderizarArbol();
                return;
            }

            try {
                const response = await fetch(`https://api.github.com/repos/${user}/${repo}/contents/datos.json`, {
                    headers: {
                        'Authorization': `token ${token}`,
                        'Accept': 'application/vnd.github.v3+json'
                    }
                });

                if (!response.ok) throw new Error("No se pudo obtener el archivo datos.json del repositorio.");

                const data = await response.json();
                fileSha = data.sha;

                const decodedContent = JSON.parse(decodeURIComponent(escape(atob(data.content))));
                personas = decodedContent.personas || [];
                idCounter = decodedContent.idCounter || 1;

                actualizarSelectorPadres();
                renderizarArbol();
            } catch (error) {
                console.error(error);
                alert("Error al cargar datos desde GitHub. Verifica tus credenciales y que el archivo datos.json exista.");
            }
        }

        // Guardar cambios directamente en el archivo datos.json en GitHub
        async function persistirDatosEnGitHub() {
            const { user, repo, token } = cargarCredenciales();

            if (!user || !repo || !token) {
                alert("Faltan las credenciales de GitHub para guardar los cambios en la nube.");
                return;
            }

            const contenidoObjeto = {
                personas: personas,
                idCounter: idCounter
            };

            const contentEncoded = btoa(unescape(encodeURIComponent(JSON.stringify(contenidoObjeto, null, 4))));

            try {
                const response = await fetch(`https://api.github.com/repos/${user}/${repo}/contents/datos.json`, {
                    method: 'PUT',
                    headers: {
                        'Authorization': `token ${token}`,
                        'Accept': 'application/vnd.github.v3+json',
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        message: "Actualizacion automatica del arbol genealogico",
                        content: contentEncoded,
                        sha: fileSha
                    })
                });

                if (!response.ok) {
                    const errData = await response.json();
                    throw new Error(errData.message || "Error al actualizar el archivo en GitHub.");
                }

                const responseData = await response.json();
                fileSha = responseData.content.sha;
            } catch (error) {
                console.error(error);
                alert("Error al guardar en GitHub: " + error.message);
            }
        }

        function seleccionarNodo(id) {
            selectedNodeId = id;
            const persona = personas.find(p => p.id === id);
            
            if (persona) {
                document.getElementById('selection-panel').style.display = 'block';
                document.getElementById('selected-name').textContent = persona.nombre;
            } else {
                deseleccionarNode();
            }

            renderizarArbol();
        }

        function deseleccionarNode() {
            selectedNodeId = null;
            document.getElementById('selection-panel').style.display = 'none';
            renderizarArbol();
        }

        function prepararAgregarHijo() {
            if (!selectedNodeId) return;
            document.getElementById('edit-id').value = "";
            document.getElementById('padre-select').value = selectedNodeId;
            document.getElementById('nombre').focus();
            evaluarModoFormulario();
        }

        function cargarEnFormularioEdicion() {
            if (!selectedNodeId) return;
            const persona = personas.find(p => p.id === selectedNodeId);
            if (!persona) return;

            document.getElementById('edit-id').value = persona.id;
            document.getElementById('nombre').value = persona.nombre;
            document.getElementById('fecha-nacimiento').value = persona.fechaNacimiento;
            document.getElementById('telefono').value = persona.telefono || '';
            document.getElementById('pareja').value = persona.pareja || '';
            document.getElementById('padre-select').value = persona.padreId || '';

            evaluarModoFormulario();
        }

        function cancelarEdicion() {
            document.getElementById('edit-id').value = "";
            document.getElementById('person-form').reset();
            evaluarModoFormulario();
        }

        function evaluarModoFormulario() {
            const editId = document.getElementById('edit-id').value;
            const select = document.getElementById('padre-select');
            const submitBtn = document.getElementById('submit-btn');
            const cancelBtn = document.getElementById('cancel-edit-btn');
            const formTitle = document.getElementById('form-title');

            if (editId) {
                formTitle.textContent = "Editar Integrante";
                submitBtn.textContent = "Guardar Cambios";
                submitBtn.className = "btn-success";
                cancelBtn.style.display = "block";
            } else {
                formTitle.textContent = "Registrar Integrante";
                submitBtn.className = "";
                cancelBtn.style.display = "none";
                if (select.value === "") {
                    submitBtn.textContent = "Establecer Inicio del Arbol (Raiz)";
                } else {
                    submitBtn.textContent = "Agregar Hijo o Rama";
                }
            }
        }

        function guardarPersona(e) {
            e.preventDefault();

            const editId = document.getElementById('edit-id').value;
            const nombre = document.getElementById('nombre').value.trim();
            const fecha = document.getElementById('fecha-nacimiento').value;
            const telefono = document.getElementById('telefono').value.trim();
            const pareja = document.getElementById('pareja').value.trim();
            const padreId = document.getElementById('padre-select').value;

            if (editId) {
                const persona = personas.find(p => p.id === parseInt(editId));
                if (persona) {
                    if (padreId && parseInt(padreId) === persona.id) {
                        alert("Una persona no puede ser su propio progenitor.");
                        return;
                    }
                    persona.nombre = nombre;
                    persona.fechaNacimiento = fecha;
                    persona.telefono = telefono || null;
                    persona.pareja = pareja || null;
                    persona.padreId = padreId ? parseInt(padreId) : null;
                }
            } else {
                if (padreId === "" && personas.length > 0) {
                    if (!confirm("Ya existe un inicio de arbol. Deseas reiniciar y establecer esta persona como la nueva raiz?")) {
                        return;
                    }
                    personas = [];
                    deseleccionarNode();
                }

                const nuevaPersona = {
                    id: idCounter++,
                    nombre: nombre,
                    fechaNacimiento: fecha,
                    telefono: telefono || null,
                    pareja: pareja || null,
                    padreId: padreId ? parseInt(padreId) : null
                };

                personas.push(nuevaPersona);
            }

            persistirDatosEnGitHub();
            cancelarEdicion();
            actualizarSelectorPadres();
            renderizarArbol();
        }

        function eliminarPersona() {
            if (!selectedNodeId) return;
            
            const tieneHijos = personas.some(p => p.padreId === selectedNodeId);
            if (tieneHijos) {
                alert("No se puede eliminar a una persona que tiene descendientes registrados. Elimine primero a los hijos.");
                return;
            }

            if (confirm("Estas seguro de eliminar a esta persona del arbol?")) {
                personas = personas.filter(p => p.id !== selectedNodeId);
                persistirDatosEnGitHub();
                deseleccionarNode();
                actualizarSelectorPadres();
                renderizarArbol();
            }
        }

        function actualizarSelectorPadres() {
            const select = document.getElementById('padre-select');
            const valorPrevio = select.value;
            select.innerHTML = '';

            if (personas.length === 0) {
                const opt = document.createElement('option');
                opt.value = "";
                opt.textContent = "Crear Inicio del Arbol (Raiz)";
                select.appendChild(opt);
            } else {
                const optRaiz = document.createElement('option');
                optRaiz.value = "";
                optRaiz.textContent = "Sin Padre / Nueva Raiz";
                select.appendChild(optRaiz);

                personas.forEach(p => {
                    const opt = document.createElement('option');
                    opt.value = p.id;
                    opt.textContent = `Hijo de: ${p.nombre}` + (p.pareja ? ` y ${p.pareja}` : '');
                    select.appendChild(opt);
                });

                select.value = valorPrevio || (personas.length > 0 ? personas[0].id : "");
            }
            evaluarModoFormulario();
        }

        function estructurarDatos() {
            if (personas.length === 0) return null;

            const mapa = {};
            personas.forEach(p => mapa[p.id] = { ...p, children: [] });

            let raiz = null;

            personas.forEach(p => {
                if (p.padreId && mapa[p.padreId]) {
                    mapa[p.padreId].children.push(mapa[p.id]);
                } else if (!raiz) {
                    raiz = mapa[p.id];
                }
            });

            return raiz ? d3.hierarchy(raiz) : null;
        }

        function renderizarArbol() {
            g.selectAll("*").remove();

            const dataJerarquica = estructurarDatos();
            if (!dataJerarquica) return;

            const root = treeLayout(dataJerarquica);

            g.selectAll(".link")
                .data(root.links())
                .enter().append("path")
                .attr("class", "link")
                .attr("d", d3.linkHorizontal()
                    .x(d => d.y)
                    .y(d => d.x));

            const node = g.selectAll(".node")
                .data(root.descendants())
                .enter().append("g")
                .attr("class", d => {
                    let cls = `node node-id-${d.data.id}`;
                    if (d.data.id === selectedNodeId) cls += ' node--selected';
                    return cls;
                })
                .attr("transform", d => `translate(${d.y},${d.x})`)
                .on("click", (event, d) => {
                    event.stopPropagation();
                    seleccionarNodo(d.data.id);
                });

            node.append("circle").attr("r", 8);

            node.append("text")
                .attr("dy", "-0.8em")
                .attr("x", 14)
                .text(d => d.data.nombre);

            node.append("text")
                .attr("class", "couple-text")
                .attr("dy", "0.4em")
                .attr("x", 14)
                .text(d => d.data.pareja ? `Pareja: ${d.data.pareja}` : '');

            node.append("text")
                .attr("class", "phone-text")
                .attr("dy", "1.6em")
                .attr("x", 14)
                .text(d => d.data.telefono ? `Tel: ${d.data.telefono}` : '');

            node.append("text")
                .attr("dy", "2.8em")
                .attr("x", 14)
                .style("fill", "#64748b")
                .style("font-size", "10px")
                .text(d => d.data.fechaNacimiento ? `Nac: ${d.data.fechaNacimiento}` : '');
        }

        function buscarPersona() {
            const query = document.getElementById('search-input').value.toLowerCase().trim();
            d3.selectAll('.node').classed('node--highlight', false);

            if (query === '') return;

            const coincidentes = personas.filter(p => 
                p.nombre.toLowerCase().includes(query) || 
                (p.pareja && p.pareja.toLowerCase().includes(query)) ||
                (p.telefono && p.telefono.includes(query))
            );

            coincidentes.forEach(p => {
                d3.selectAll(`.node-id-${p.id}`).classed('node--highlight', true);
            });
        }

        // Al iniciar la pagina, carga automaticamente credenciales y sincroniza el arbol
        window.onload = () => {
            cargarCredenciales();
            cargarDatosDesdeGitHub();
        };
    </script>
</body>
</html>
