<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galería Protegida</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 20px;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
        }

        .galeria {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }
        
        .contenedor-foto {
            position: relative;
            background: #fff;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            transition: transform 0.2s ease;
            user-select: none;
            -webkit-user-select: none;
        }

        .contenedor-foto:hover {
            transform: translateY(-5px);
        }

        .contenedor-foto img {
            width: 100%;
            height: 250px;
            object-fit: cover;
            display: block;
            pointer-events: none; /* Bloquea clics y arrastres directos sobre la imagen */
        }

        /* Capa invisible que bloquea cualquier interacción directa (clics, guardar como, etc.) */
        .bloqueo-interaccion {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
        }

        /* Estilo de la marca de agua repetida */
        .marca-de-agua {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: repeating-linear-gradient(
                -45deg,
                transparent,
                transparent 40px,
                rgba(255, 255, 255, 0.25) 40px,
                rgba(255, 255, 255, 0.25) 80px
            );
            display: flex;
            justify-content: center;
            align-items: center;
            pointer-events: none;
            user-select: none;
            overflow: hidden;
            z-index: 5;
        }

        .marca-de-agua::before {
            content: "T-Rec \A T-Rec \A T-Rec";
            white-space: pre-wrap;
            font-size: 16px;
            font-weight: bold;
            color: rgba(255, 255, 255, 0.4);
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.6);
            transform: rotate(-30deg);
            text-align: center;
            line-height: 2.5em;
            letter-spacing: 2px;
        }

        .mensaje {
            text-align: center;
            grid-column: 1 / -1;
            font-size: 18px;
            color: #666;
        }
    </style>
</head>
<body oncontextmenu="return false;"> <!-- Bloquea el clic derecho en toda la página -->

    <h1>Galería Protegida</h1>
    
    <div id="galeria-drive" class="galeria">
        <div class="mensaje" id="texto-estado">Cargando fotos...</div>
    </div>

    <script>
        // PEGA AQUÍ LA URL DE TU APLICACIÓN WEB DE APPS SCRIPT
        const urlAppsScript = "https://script.google.com/macros/s/AKfycbyW4FhyTdpud2PDURjQDYE9ExrSLt3h6-AuUvU9xUXBAu9TYLqY0fe47zdvS2aFIiBT/exec";

        async function cargarFotos() {
            const galeriaContainer = document.getElementById('galeria-drive');
            
            try {
                const respuesta = await fetch(urlAppsScript);
                const idsFotos = await respuesta.json();

                galeriaContainer.innerHTML = ""; 

                if (!Array.isArray(idsFotos) || idsFotos.length === 0) {
                    galeriaContainer.innerHTML = `<p class="mensaje">No se encontraron imágenes en la carpeta.</p>`;
                    return;
                }

                idsFotos.forEach(id => {
                    const div = document.createElement('div');
                    div.className = 'contenedor-foto';

                    // Agregamos la estructura con una capa invisible encima para bloquear acciones
                    div.innerHTML = `
                        <img src="https://lh3.googleusercontent.com/d/${id}" alt="Foto de Google Drive" loading="lazy">
                        <div class="marca-de-agua"></div>
                        <div class="bloqueo-interaccion"></div>
                    `;

                    galeriaContainer.appendChild(div);
                });

            } catch (error) {
                console.error("Detalle del error:", error);
                galeriaContainer.innerHTML = `<p class="mensaje" style="color: red;">Error al cargar las fotos.</p>`;
            }
        }

        cargarFotos();
    </script>

</body>
</html>
