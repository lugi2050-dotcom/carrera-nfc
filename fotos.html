<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galería - El Ing</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 20px;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
        }

        .galeria {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }
        
        .contenedor-foto {
            position: relative;
            background: #fff;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            transition: transform 0.2s ease;
        }

        .contenedor-foto:hover {
            transform: translateY(-5px);
        }

        .contenedor-foto img {
            width: 100%;
            height: 250px;
            object-fit: cover;
            display: block;
        }

        /* --- NUEVO ESTILO DE MARCA DE AGUA REPETIDA Y TRANSPARENTE --- */
        .marca-de-agua {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            /* Creamos un patrón repetido de texto rotado con baja opacidad */
            background-image: repeating-linear-gradient(
                -45deg,
                transparent,
                transparent 40px,
                rgba(255, 255, 255, 0.25) 40px,
                rgba(255, 255, 255, 0.25) 80px
            );
            /* Esto genera el texto repetido en mosaico sobre la imagen */
            display: flex;
            justify-content: center;
            align-items: center;
            pointer-events: none; /* Evita interferir con los clics */
            user-select: none;
            overflow: hidden;
        }

        /* Capa interna para duplicar visualmente el texto en patrón cruzado */
        .marca-de-agua::before {
            content: "El Ing   El Ing   El Ing \A El Ing   El Ing   El Ing \A El Ing   El Ing   El Ing";
            white-space: pre-wrap;
            font-size: 16px;
            font-weight: bold;
            color: rgba(255, 255, 255, 0.4); /* Letras blancas semitransparentes */
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.6); /* Sombra para que se lea en fondos claros y oscuros */
            transform: rotate(-30deg);
            text-align: center;
            line-height: 2.5em;
            letter-spacing: 2px;
        }

        .mensaje {
            text-align: center;
            grid-column: 1 / -1;
            font-size: 18px;
            color: #666;
        }
    </style>
</head>
<body>

    <h1>Galería Protegida</h1>
    
    <div id="galeria-drive" class="galeria">
        <div class="mensaje" id="texto-estado">Cargando fotos desde Google Drive...</div>
    </div>

    <script>
        // PEGA AQUÍ LA URL DE TU APLICACIÓN WEB DE APPS SCRIPT
        const urlAppsScript = "https://script.google.com/macros/s/AKfycbx3TzW77Za5038JxAZ8y_n9R_KA-NqtVXryrH8bDDTO6Wv8OpI_uEdS-ATAtCWS8Qavzg/exec";

        async function cargarFotos() {
            const galeriaContainer = document.getElementById('galeria-drive');
            const textoEstado = document.getElementById('texto-estado');
            
            try {
                const respuesta = await fetch(urlAppsScript);
                
                if (!respuesta.ok) {
                    throw new Error(`Error HTTP: ${respuesta.status}`);
                }

                const idsFotos = await respuesta.json();

                galeriaContainer.innerHTML = ""; 

                if (!Array.isArray(idsFotos) || idsFotos.length === 0) {
                    galeriaContainer.innerHTML = `<p class="mensaje">No se encontraron imágenes o la carpeta está vacía.</p>`;
                    return;
                }

                // Genera las imágenes dinámicamente con el patrón de marca de agua
                idsFotos.forEach(id => {
                    const div = document.createElement('div');
                    div.className = 'contenedor-foto';

                    div.innerHTML = `
                        <img src="https://lh3.googleusercontent.com/d/${id}" alt="Foto de Google Drive" loading="lazy">
                        <div class="marca-de-agua"></div>
                    `;

                    galeriaContainer.appendChild(div);
                });

            } catch (error) {
                console.error("Detalle del error:", error);
                galeriaContainer.innerHTML = `<p class="mensaje" style="color: red;">Error al cargar las fotos. Revisa la consola del navegador (F12).</p>`;
            }
        }

        cargarFotos();
    </script>

</body>
</html>
