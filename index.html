<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi WebAR</title>

  <!-- Previene error 404 de favicon -->
  <link rel="icon" href="data:,">

  <!-- A-Frame 1.3.0 (Altamente compatible con AR.js) -->
  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>

  <!-- AR.js para A-Frame (Build de CDN estable) -->
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
</head>
<body style="margin: 0; overflow: hidden;">

  <a-scene 
    embedded 
    arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono_and_matrix; matrixCodeType: 3x3;">
    
    <a-assets>
      <!-- Asegúrate de usar ruta relativa limpia -->
      <a-asset-item id="modelo" src="./modelo.glb"></a-asset-item>
    </a-assets>

    <a-marker preset="hiro">
      <a-entity 
        gltf-model="#modelo" 
        scale="0.2 0.2 0.2" 
        position="0 0 0">
      </a-entity>
    </a-marker>

    <a-entity camera></a-entity>
    
  </a-scene>

</body>
</html><!DOCTYPE html>

</html><!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi Primera WebAR</title>
  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
  <!-- AR.js para A-Frame -->
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
</head>
<body style="margin: 0; overflow: hidden;">

  <!-- Escena de AR habilitando el uso de la cámara del usuario -->
  <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">
    
    <!-- Carga previa de assets (Modelo 3D en formato GLTF / GLB) -->
    <a-assets>
      <a-asset-item id="modelo" src="./modelo.glb"></a-asset-item>
    </a-assets>

    <!-- Marcador tipo Hiro (Marcador predeterminado de AR.js) -->
    <a-marker preset="hiro">
      <!-- Entidad del modelo 3D posicionado dentro del marcador -->
      <a-entity 
        gltf-model="#modelo" 
        scale="0.5 0.5 0.5" 
        position="0 0 0" 
        rotation="0 0 0">
      </a-entity>
    </a-marker>

    <!-- Cámara de la escena AR -->
    <a-entity camera></a-entity>
    
  </a-scene>

</body>
</html>
