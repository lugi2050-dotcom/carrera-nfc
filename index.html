<a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">
  
  <a-assets>
    <a-asset-item id="modelo" src="./modelo.glb"></a-asset-item>
  </a-assets>

  <!-- Luz ambiental para iluminar las texturas del modelo -->
  <a-light type="ambient" color="#FFF" intensity="1.5"></a-light>
  <a-light type="directional" position="-1 2 1" intensity="1"></a-light>

  <a-marker preset="hiro">
    <!-- Prueba con escalas pequeñas como 0.05 o mayores como 2 si no aparece -->
    <a-entity 
      gltf-model="#modelo" 
      scale="0.1 0.1 0.1" 
      position="0 0 0"
      rotation="0 0 0">
    </a-entity>
  </a-marker>

  <a-entity camera></a-entity>
  
</a-scene>
