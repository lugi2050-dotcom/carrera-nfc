<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Visor 3D Interactivo</title>
  
  <!-- Previene error 404 de favicon -->
  <link rel="icon" href="data:,">

  <!-- Carga de model-viewer desde CDN de Google -->
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>

  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #121212;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: sans-serif;
    }

    model-viewer {
      width: 100vw;
      height: 100vh;
      --poster-color: transparent;
    }
  </style>
</head>
<body>

  <!-- Visor 3D: no pide cámara, permite rotación 360 y zoom -->
  <model-viewer 
    src="./modelo1.glb" 
    alt="Modelo 3D" 
    camera-controls 
    auto-rotate 
    shadow-intensity="1" 
    ar>
  </model-viewer>

</body>
</html>
