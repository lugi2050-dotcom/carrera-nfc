<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Visor 3D - Modelo GLB</title>
  
  <!-- Evita el error 404 del favicon -->
  <link rel="icon" href="data:,">

  <!-- Carga del componente model-viewer de Google -->
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: #1a1a1a;
      color: #ffffff;
    }

    /* Estilos del visor 3D ocupando toda la pantalla */
    model-viewer {
      width: 100vw;
      height: 100vh;
      --poster-color: transparent;
    }

    /* Indicador visual de carga mientras baja el .glb */
    .progress-bar {
      display: block;
      width: 33%;
      height: 10%;
      max-height: 2px;
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      border-radius: 2px;
      background-color: rgba(255, 255, 255, 0.2);
    }

    .update-bar {
      background-color: #00e5ff;
      width: 0%;
      height: 100%;
      border-radius: 2px;
      transition: width 0.1s ease;
    }

    /* Panel de controles sobrepuesto */
    .controls-panel {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(8px);
      padding: 10px 20px;
      border-radius: 30px;
      display: flex;
      gap: 12px;
      align-items: center;
      border: 1px solid rgba(255, 255, 255, 0.1);
      z-index: 10;
    }

    .btn {
      background: #00e5ff;
      color: #000;
      border: none;
      padding: 8px 16px;
      border-radius: 20px;
      font-weight: 600;
      cursor: pointer;
      font-size: 14px;
      transition: background 0.2s ease, transform 0.1s ease;
    }

    .btn:hover {
      background: #80f3ff;
    }

    .btn:active {
      transform: scale(0.96);
    }
  </style>
</head>
<body>

  <!-- Visor 3D principal -->
  <model-viewer 
    id="visor-3d"
    src="./modelo.glb" 
    alt="Modelo 3D Interactivo" 
    camera-controls 
    auto-rotate 
    shadow-intensity="1" 
    shadow-softness="0.8"
    exposure="1"
    environment-image="neutral"
    touch-action="pan-y">
    
    <!-- Barra de progreso de carga -->
    <div class="progress-bar" slot="progress-bar">
      <div class="update-bar" id="update-bar"></div>
    </div>
  </model-viewer>

  <!-- Panel flotante de botones -->
  <div class="controls-panel">
    <button class="btn" id="btn-reset">Restablecer Vista</button>
    <button class="btn" id="btn-rotate">Pausar/Girar</button>
  </div>

  <script>
    const viewer = document.querySelector('#visor-3d');
    const updateBar = document.querySelector('#update-bar');
    const btnReset = document.querySelector('#btn-reset');
    const btnRotate = document.querySelector('#btn-rotate');

    // Actualiza la barra de progreso al descargar el archivo .glb
    viewer.addEventListener('progress', (event) => {
      const progress = event.detail.totalProgress * 100;
      if (updateBar) {
        updateBar.style.width = `${progress}%`;
      }
    });

    // Oculta la barra al finalizar la carga
    viewer.addEventListener('load', () => {
      console.log('Modelo 3D cargado con éxito.');
    });

    // Botón para centrar y restablecer la cámara
    btnReset.addEventListener('click', () => {
      viewer.cameraTarget = 'auto auto auto';
      viewer.cameraOrbit = '0deg 75deg 105%';
    });

    // Botón para alternar la rotación automática
    btnRotate.addEventListener('click', () => {
      viewer.autoRotate = !viewer.autoRotate;
    });
  </script>

</body>
</html>
