<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Visor 3D - Modelo GLB</title>
  
  <!-- Evita el error 404 del favicon -->
  <link rel="icon" href="data:,">

  <!-- Carga del componente model-viewer de Google -->
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #1a1a1a;
    }

    /* Visor 3D a pantalla completa */
    model-viewer {
      width: 100vw;
      height: 100vh;
      --poster-color: transparent;
    }

    /* Indicador visual de carga centrado */
    .progress-bar {
      display: block;
      width: 33%;
      height: 10%;
      max-height: 2px;
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      border-radius: 2px;
      background-color: rgba(255, 255, 255, 0.2);
    }

    .update-bar {
      background-color: #00e5ff;
      width: 0%;
      height: 100%;
      border-radius: 2px;
      transition: width 0.1s ease;
    }
  </style>
</head>
<body>

  <!-- Visor 3D limpio sin interfaz de botones -->
  <model-viewer 
    id="visor-3d"
    src="./modelo.glb" 
    alt="Modelo 3D Interactivo" 
    camera-controls 
    auto-rotate 
    shadow-intensity="1" 
    shadow-softness="0.8"
    exposure="1"
    environment-image="neutral"
    touch-action="pan-y">
    
    <!-- Barra de progreso que aparece solo mientras carga -->
    <div class="progress-bar" slot="progress-bar">
      <div class="update-bar" id="update-bar"></div>
    </div>
  </model-viewer>

  <script>
    const viewer = document.querySelector('#visor-3d');
    const updateBar = document.querySelector('#update-bar');

    // Actualiza la barra de progreso de carga
    viewer.addEventListener('progress', (event) => {
      const progress = event.detail.totalProgress * 100;
      if (updateBar) {
        updateBar.style.width = `${progress}%`;
      }
    });
  </script>

</body>
</html>
