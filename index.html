<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Visor 3D - PAYNAL</title>
  
  <!-- Evita el error 404 del favicon -->
  <link rel="icon" href="data:,">

  <!-- Carga del componente model-viewer de Google -->
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #1a1a1a;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    /* Visor 3D a pantalla completa */
    model-viewer {
      width: 100vw;
      height: 100vh;
      --poster-color: transparent;
    }

    /* Título Superior PAYNAL */
    .header-title {
      position: absolute;
      top: 24px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(6px);
      color: #ffffff;
      font-size: 20px;
      font-weight: 800;
      letter-spacing: 3px;
      text-transform: uppercase;
      padding: 10px 24px;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      z-index: 10;
      pointer-events: none;
    }

    /* Porcentaje de carga en color anaranjado */
    .loading-percentage {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(6px);
      color: #ff6b00; /* Color anaranjado */
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.5px;
      padding: 6px 16px;
      border-radius: 20px;
      border: 1px solid rgba(255, 107, 0, 0.3); /* Borde anaranjado sutil */
      z-index: 10;
      transition: opacity 0.4s ease;
      pointer-events: none;
    }

    .loading-percentage.hidden {
      opacity: 0;
    }
  </style>
</head>
<body>

  <!-- Título Superior -->
  <div class="header-title">paynal</div>

  <!-- Visor 3D sin giro automático -->
  <model-viewer 
    id="visor-3d"
    src="./modelo.glb" 
    alt="Modelo 3D Interactivo" 
    camera-controls 
    shadow-intensity="1" 
    shadow-softness="0.8"
    exposure="1"
    environment-image="neutral"
    touch-action="pan-y">
    
    <!-- Elemento del porcentaje en la parte inferior -->
    <div id="progress-text" class="loading-percentage" slot="progress-bar">
      Cargando 0%
    </div>
  </model-viewer>

  <script>
    const viewer = document.querySelector('#visor-3d');
    const progressText = document.querySelector('#progress-text');

    // Actualiza el texto con el porcentaje exacto de descarga
    viewer.addEventListener('progress', (event) => {
      const percentage = Math.round(event.detail.totalProgress * 100);
      if (progressText) {
        progressText.textContent = `Cargando ${percentage}%`;
      }
    });

    // Oculta suavemente el texto de porcentaje cuando el modelo termina de renderizar
    viewer.addEventListener('load', () => {
      if (progressText) {
        progressText.classList.add('hidden');
      }
    });
  </script>

</body>
</html>
