<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Carrera NFC</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 500px; margin: 20px auto; padding: 15px; text-align: center; }
        #cronometro { font-size: 3rem; font-weight: bold; margin: 15px 0; color: #222; }
        .estado-nfc { padding: 12px; margin: 15px 0; border-radius: 8px; background-color: #e9ecef; font-weight: bold; }
        .activo { background-color: #d4edda; color: #155724; }
        .error { background-color: #f8d7da; color: #721c24; }
        .finalizado { background-color: #fff3cd; color: #856404; }
        button { font-size: 1rem; padding: 10px 15px; margin: 5px; border-radius: 5px; border: none; cursor: pointer; }
        .btn-iniciar { background-color: #007bff; color: white; }
        .btn-nfc { background-color: #28a745; color: white; }
        .btn-finalizar { background-color: #dc3545; color: white; }
        .btn-borrar { background-color: #6c757d; color: white; margin-top: 15px; }
        button:disabled { background-color: #ccc; cursor: not-allowed; }
        table { width: 100%; margin-top: 20px; border-collapse: collapse; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: center; }
        th { background-color: #f4f4f4; }
    </style>
</head>
<body>

    <h2>Control de Carrera NFC</h2>
    <div id="cronometro">00:00:00.0</div>

    <div class="controles">
        <button id="btnIniciar" class="btn-iniciar" onclick="iniciarCarrera()">Iniciar Carrera</button>
        <button id="btnActivarNFC" class="btn-nfc" onclick="activarLecturaNFC()" disabled>📡 Activar NFC</button>
        <button id="btnFinalizar" class="btn-finalizar" onclick="finalizarCarrera()" disabled>Finalizar Carrera</button>
    </div>

    <div id="estadoNFC" class="estado-nfc">Inicia la carrera para activar el lector</div>

    <div style="margin-top: 15px;">
        <button id="btnExportar" class="btn-nfc" onclick="exportarCSV()" disabled>📥 Descargar Resultados (CSV)</button>
    </div>

    <table>
        <thead>
            <tr>
                <th>Lugar</th>
                <th>ID Corredor (NFC)</th>
                <th>Tiempo</th>
            </tr>
        </thead>
        <tbody id="tablaResultados"></tbody>
    </table>

    <!-- Botón de borrado ubicado al final de los registros -->
    <button id="btnBorrar" class="btn-borrar" onclick="borrarRegistros()">🗑️ Borrar Todos los Registros</button>

    <script>
        let tiempoInicio = 0;
        let intervalo = null;
        let corriendo = false;
        let posicion = 1;
        let controladorNFC = null;
        let listaRegistros = JSON.parse(localStorage.getItem('carrera_nfc_registros')) || [];

        window.onload = function() {
            if (listaRegistros.length > 0) {
                posicion = listaRegistros.length + 1;
                renderizarTabla();
                document.getElementById('btnExportar').disabled = false;
            }
        };

        function actualizarCronometro() {
            const diferencia = Date.now() - tiempoInicio;
            const ms = Math.floor((diferencia % 1000) / 100);
            const seg = Math.floor((diferencia / 1000) % 60).toString().padStart(2, '0');
            const min = Math.floor((diferencia / (1000 * 60)) % 60).toString().padStart(2, '0');
            const hrs = Math.floor(diferencia / (1000 * 60 * 60)).toString().padStart(2, '0');
            
            const tiempoFormateado = `${hrs}:${min}:${seg}.${ms}`;
            document.getElementById('cronometro').textContent = tiempoFormateado;
            return tiempoFormateado;
        }

        function iniciarCarrera() {
            if (!corriendo) {
                tiempoInicio = Date.now();
                intervalo = setInterval(actualizarCronometro, 100);
                corriendo = true;
                
                document.getElementById('btnIniciar').disabled = true;
                document.getElementById('btnActivarNFC').disabled = false;
                document.getElementById('btnFinalizar').disabled = false;
                document.getElementById('estadoNFC').textContent = "Presiona 'Activar NFC' y acerca una tarjeta";
            }
        }

        async function activarLecturaNFC() {
            const indicador = document.getElementById('estadoNFC');

            if (!('NDEFReader' in window)) {
                indicador.textContent = "❌ Tu navegador/celular no soporta Web NFC.";
                indicador.className = "estado-nfc error";
                return;
            }

            try {
                controladorNFC = new AbortController();
                const ndef = new NDEFReader();
                
                await ndef.scan({ signal: controladorNFC.signal });
                
                indicador.textContent = "🟢 Lector NFC activo. Acerque el chip al celular...";
                indicador.className = "estado-nfc activo";

                ndef.addEventListener("reading", ({ serialNumber, message }) => {
                    if (!corriendo) return;

                    let idCapturado = serialNumber;

                    for (const record of message.records) {
                        if (record.recordType === "text") {
                            const textDecoder = new TextDecoder(record.encoding);
                            idCapturado = textDecoder.decode(record.data);
                        }
                    }

                    registrarLlegada(idCapturado);
                });

            } catch (error) {
                indicador.textContent = "❌ Error al iniciar NFC: " + error;
                indicador.className = "estado-nfc error";
            }
        }

        function registrarLlegada(idCorredor) {
            const tiempoActual = actualizarCronometro();
            
            const nuevoRegistro = { lugar: posicion, corredor: idCorredor, tiempo: tiempoActual };
            listaRegistros.push(nuevoRegistro);
            localStorage.setItem('carrera_nfc_registros', JSON.stringify(listaRegistros));

            posicion++;
            renderizarTabla();

            if (navigator.vibrate) navigator.vibrate(200);
        }

        function renderizarTabla() {
            const tabla = document.getElementById('tablaResultados');
            tabla.innerHTML = "";
            listaRegistros.forEach(reg => {
                const fila = document.createElement('tr');
                fila.innerHTML = `
                    <td><strong>#${reg.lugar}</strong></td>
                    <td>${reg.corredor}</td>
                    <td>${reg.tiempo}</td>
                `;
                tabla.appendChild(fila);
            });
        }

        function finalizarCarrera() {
            clearInterval(intervalo);
            corriendo = false;

            if (controladorNFC) {
                controladorNFC.abort();
            }

            document.getElementById('btnActivarNFC').disabled = true;
            document.getElementById('btnFinalizar').disabled = true;
            document.getElementById('btnExportar').disabled = false;

            const indicador = document.getElementById('estadoNFC');
            indicador.textContent = "🏁 Carrera Finalizada. Resultados listos para descargar.";
            indicador.className = "estado-nfc finalizado";
        }

        function exportarCSV() {
            if (listaRegistros.length === 0) return;

            let csvContent = "data:text/csv;charset=utf-8,Lugar,ID NFC Corredor,Tiempo\n";
            listaRegistros.forEach(r => {
                csvContent += `${r.lugar},${r.corredor},${r.tiempo}\n`;
            });

            const encodedUri = encodeURI(csvContent);
            const link = document.createElement("a");
            link.setAttribute("href", encodedUri);
            link.setAttribute("download", `resultados_nfc_${new Date().toISOString().slice(0,10)}.csv`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        function borrarRegistros() {
            if (confirm("¿Estás seguro de que deseas borrar toda la tabla y limpiar la memoria?")) {
                clearInterval(intervalo);
                if (controladorNFC) controladorNFC.abort();

                localStorage.removeItem('carrera_nfc_registros');
                listaRegistros = [];
                corriendo = false;
                posicion = 1;

                document.getElementById('cronometro').textContent = "00:00:00.0";
                document.getElementById('btnIniciar').disabled = false;
                document.getElementById('btnActivarNFC').disabled = true;
                document.getElementById('btnFinalizar').disabled = true;
                document.getElementById('btnExportar').disabled = true;

                const indicador = document.getElementById('estadoNFC');
                indicador.textContent = "Inicia la carrera para activar el lector";
                indicador.className = "estado-nfc";

                renderizarTabla();
            }
        }
    </script>
</body>
</html>
