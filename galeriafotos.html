<!DOCTYPE html>
<html lang="es" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galería de Fotos | El Ing</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0f9ff',
                            100: '#e0f2fe',
                            500: '#0ea5e9',
                            600: '#0284c7',
                            700: '#0369a1',
                            900: '#0c4a6e',
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <!-- Google Fonts & FontAwesome Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .glassmorphism {
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: rgba(15, 23, 42, 0.6); }
        ::-webkit-scrollbar-thumb { background: rgba(14, 165, 233, 0.5); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(14, 165, 233, 0.8); }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col antialiased selection:bg-brand-500 selection:text-white">

    <!-- ========================================================================= -->
    <!-- HEADER / NAVBAR CON MENÚ DESPLEGABLE                                      -->
    <!-- ========================================================================= -->
    <header class="sticky top-0 z-40 w-full glassmorphism">
        <div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-20 relative">
                <!-- Logotipo / Título Principal -->
                <a href="index.html" class="flex items-center gap-3">
                    <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-brand-600 to-indigo-500 flex items-center justify-center shadow-lg shadow-brand-500/20">
                        <i class="fa-solid fa-shapes font-bold text-white text-xl"></i>
                    </div>
                    <span class="font-bold text-lg tracking-tight bg-gradient-to-r from-white via-slate-200 to-brand-400 bg-clip-text text-transparent">
                        EL ING VUELA
                    </span>
                </a>

                <!-- Botón Menú Hamburguesa -->
                <button id="menu-toggle-btn" class="px-4 py-2.5 rounded-xl bg-slate-900/80 hover:bg-slate-800 border border-slate-800 hover:border-slate-700 text-slate-300 hover:text-white transition-all flex items-center gap-2.5 shadow focus:outline-none" aria-label="Abrir Menú">
                    <i id="menu-icon" class="fa-solid fa-bars text-lg text-brand-400"></i>
                    <span class="text-sm font-semibold">Menú</span>
                </button>

                <!-- Menú Desplegable -->
                <nav id="dropdown-menu" class="hidden absolute top-full right-0 mt-2 w-64 bg-slate-900/95 border border-slate-800 rounded-2xl shadow-2xl p-3 backdrop-blur-xl flex flex-col gap-1 z-50">
                    <a href="index.html" class="px-4 py-3 rounded-xl hover:bg-slate-800 text-sm font-semibold text-slate-300 hover:text-white transition-all flex items-center gap-3">
                        <i class="fa-solid fa-house text-brand-400 w-5"></i>
                        <span>INICIO</span>
                    </a>
                    <a href="galeriafotos.html" class="px-4 py-3 rounded-xl hover:bg-slate-800 text-sm font-semibold text-slate-300 hover:text-white transition-all flex items-center gap-3">
                        <i class="fa-solid fa-images text-indigo-400 w-5"></i>
                        <span>GALERÍA</span>
                    </a>
                    <a href="precios.html" class="px-4 py-3 rounded-xl hover:bg-slate-800 text-sm font-semibold text-slate-300 hover:text-white transition-all flex items-center gap-3">
                        <i class="fa-solid fa-tag text-emerald-400 w-5"></i>
                        <span>PRECIOS</span>
                    </a>
                    <a href="carreras.html" class="px-4 py-3 rounded-xl hover:bg-slate-800 text-sm font-semibold text-slate-300 hover:text-white transition-all flex items-center gap-3">
                        <i class="fa-solid fa-laptop-code text-cyan-400 w-5"></i>
                        <span>CRONOMETRO</span>
                    </a>
                    <a href="casa.html" class="px-4 py-3 rounded-xl hover:bg-slate-800 text-sm font-semibold text-slate-300 hover:text-white transition-all flex items-center gap-3">
                        <i class="fa-solid fa-cube text-emerald-400 w-5"></i>
                        <span>CASA 3D</span>
                    </a>
                </nav>
            </div>
        </div>
    </header>

    <!-- Contenido Principal -->
    <main class="flex-grow max-w-6xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-10 space-y-12">

        <!-- Encabezado de la Sección -->
        <section class="text-center max-w-3xl mx-auto space-y-4">
            <h1 class="text-3xl sm:text-5xl font-extrabold text-white tracking-tight">
                TRABAJOS
            </h1>
        </section>

        <!-- Contenedor de la Galería -->
        <section id="galeria-drive" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6">
            <div class="text-center col-span-full py-16 text-slate-400 text-sm" id="texto-estado">
                <i class="fa-solid fa-spinner fa-spin text-brand-400 text-2xl mb-3 block"></i>
                Cargando fotos...
            </div>
        </section>

    </main>

    <!-- Footer -->
    <footer class="border-t border-slate-900 bg-slate-950 py-8 mt-auto">
        <div class="max-w-6xl mx-auto px-4 text-center text-xs text-slate-500">
            <p>2026 Portafolio de Proyectos. 5618782196</p>
        </div>
    </footer>

    <!-- Scripts de Funcionalidad y Galería -->
    <script>
        // LÓGICA DEL MENÚ DESPLEGABLE
        const menuToggleBtn = document.getElementById('menu-toggle-btn');
        const dropdownMenu = document.getElementById('dropdown-menu');
        const menuIcon = document.getElementById('menu-icon');

        function toggleMenu() {
            const isHidden = dropdownMenu.classList.contains('hidden');
            if (isHidden) {
                dropdownMenu.classList.remove('hidden');
                menuIcon.className = "fa-solid fa-xmark text-lg text-brand-400";
            } else {
                dropdownMenu.classList.add('hidden');
                menuIcon.className = "fa-solid fa-bars text-lg text-brand-400";
            }
        }

        menuToggleBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            toggleMenu();
        });

        document.addEventListener('click', (e) => {
            if (!dropdownMenu.contains(e.target) && !menuToggleBtn.contains(e.target)) {
                dropdownMenu.classList.add('hidden');
                menuIcon.className = "fa-solid fa-bars text-lg text-brand-400";
            }
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                dropdownMenu.classList.add('hidden');
                menuIcon.className = "fa-solid fa-bars text-lg text-brand-400";
            }
        });

        // CARGA DE FOTOS DESDE GOOGLE DRIVE (APPS SCRIPT)
        const urlAppsScript = "https://script.google.com/macros/s/AKfycbx3TzW77Za5038JxAZ8y_n9R_KA-NqtVXryrH8bDDTO6Wv8OpI_uEdS-ATAtCWS8Qavzg/exec";

        async function cargarFotos() {
            const galeriaContainer = document.getElementById('galeria-drive');
            
            try {
                const respuesta = await fetch(urlAppsScript);
                
                if (!respuesta.ok) {
                    throw new Error(`Error HTTP: ${respuesta.status}`);
                }

                const fotos = await respuesta.json();

                galeriaContainer.innerHTML = ""; // Limpiar estado de carga

                if (!Array.isArray(fotos) || fotos.length === 0) {
                    galeriaContainer.innerHTML = `<div class="col-span-full text-center py-12 text-slate-400 text-sm">No se encontraron imágenes o la carpeta está vacía.</div>`;
                    return;
                }

                // Genera las imágenes dinámicamente mostrando el nombre de la foto dentro de la imagen
                fotos.forEach(foto => {
                    const div = document.createElement('div');
                    div.className = 'bg-slate-900 border border-slate-800 rounded-3xl overflow-hidden shadow-xl transition-all duration-300 hover:scale-[1.02] relative group';

                    div.innerHTML = `
                        <div class="relative h-64 w-full overflow-hidden bg-slate-950">
                            <img src="https://lh3.googleusercontent.com/d/${foto.id}" alt="${foto.name}" loading="lazy" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500">
                            <div class="absolute bottom-3 left-3 right-3 bg-slate-950/80 backdrop-blur-md text-slate-100 border border-white/10 px-3 py-1.5 text-xs font-semibold tracking-wider rounded-xl shadow-lg truncate pointer-events-none select-none text-center" title="${foto.name}">
                                ${foto.name}
                            </div>
                        </div>
                    `;

                    galeriaContainer.appendChild(div);
                });

            } catch (error) {
                console.error("Detalle del error:", error);
                galeriaContainer.innerHTML = `<div class="col-span-full text-center py-10 text-rose-400 text-sm">Error al cargar las fotos. Revisa la consola del navegador (F12) para más detalles.</div>`;
            }
        }

        cargarFotos();
    </script>

</body>
</html>
