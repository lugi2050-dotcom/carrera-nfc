<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FOTOS CARRERA</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 20px;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
        }

        .galeria {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }
        
        .contenedor-foto {
            position: relative;
            background: #fff;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            transition: transform 0.2s ease;
        }

        .contenedor-foto:hover {
            transform: translateY(-5px);
        }

        .contenedor-foto img {
            width: 100%;
            height: 250px;
            object-fit: cover;
            display: block;
        }

        .mensaje {
            text-align: center;
            grid-column: 1 / -1;
            font-size: 18px;
            color: #666;
        }
    </style>
</head>
<body>

    <h1>FOTOS PAYNAL RACE</h1>
    
    <div id="galeria-drive" class="galeria">
        <div class="mensaje" id="texto-estado">Cargando fotos...</div>
    </div>

    <script>
        const urlAppsScript = "https://script.google.com/macros/s/AKfycbyW4FhyTdpud2PDURjQDYE9ExrSLt3h6-AuUvU9xUXBAu9TYLqY0fe47zdvS2aFIiBT/exec";

        async function cargarFotos() {
            const galeriaContainer = document.getElementById('galeria-drive');
            
            try {
                const respuesta = await fetch(urlAppsScript);
                const idsFotos = await respuesta.json();

                galeriaContainer.innerHTML = ""; 

                if (!Array.isArray(idsFotos) || idsFotos.length === 0) {
                    galeriaContainer.innerHTML = `<p class="mensaje">No se encontraron imágenes en la carpeta.</p>`;
                    return;
                }

                idsFotos.forEach(id => {
                    const div = document.createElement('div');
                    div.className = 'contenedor-foto';

                    // Se eliminaron la capa de marca de agua y el bloqueo de interacción
                    div.innerHTML = `
                        <img src="https://lh3.googleusercontent.com/d/${id}" alt="Foto de Google Drive" loading="lazy">
                    `;

                    galeriaContainer.appendChild(div);
                });

            } catch (error) {
                console.error("Detalle del error:", error);
                galeriaContainer.innerHTML = `<p class="mensaje" style="color: red;">Error al cargar las fotos.</p>`;
            }
        }

        cargarFotos();
    </script>

</body>
</html>
