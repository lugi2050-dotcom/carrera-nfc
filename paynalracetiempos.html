<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PAYNAL RACE - Consulta de Corredor</title>
    <style>
        :root {
            --bg-color: #000000;
            --card-bg: #09090b;
            --primary: #f97316;
            --primary-hover: #ea580c;
            --accent: #fb923c;
            --success: #22c55e;
            --danger: #ef4444;
            --text-light: #f8fafc;
            --border-color: #27272a;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-light);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 15px;
        }

        .search-card {
            background: var(--card-bg);
            border: 2px solid var(--primary);
            border-radius: 16px;
            padding: 25px 20px;
            width: 100%;
            max-width: 480px;
            box-shadow: 0 10px 30px rgba(249, 115, 22, 0.15);
            text-align: center;
        }

        .brand-title {
            color: var(--primary);
            font-size: 1.8rem;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 4px;
        }

        .sub-title {
            color: #a1a1aa;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 20px;
        }

        .input-box {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
            width: 100%;
        }

        input[type="number"] {
            flex: 1;
            min-width: 0;
            background: #000000;
            color: #ffffff;
            border: 2px solid var(--primary);
            border-radius: 12px;
            padding: 12px 10px;
            font-size: 1.8rem;
            text-align: center;
            font-weight: bold;
            font-family: monospace;
            outline: none;
            transition: all 0.2s ease;
        }

        input[type="number"]:focus {
            box-shadow: 0 0 12px rgba(249, 115, 22, 0.5);
            border-color: var(--accent);
        }

        input[type="number"]::-webkit-inner-spin-button, 
        input[type="number"]::-webkit-outer-spin-button { 
            -webkit-appearance: none; 
            margin: 0; 
        }

        .btn-search {
            background: var(--primary);
            color: #000000;
            border: none;
            padding: 0 20px;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 800;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            white-space: nowrap;
        }

        .btn-search:hover {
            background: var(--primary-hover);
        }

        .btn-search:active { transform: scale(0.95); }

        .btn-photos {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            background: #000000;
            color: var(--primary);
            border: 2px solid var(--primary);
            padding: 12px;
            border-radius: 12px;
            font-size: 0.95rem;
            font-weight: 800;
            text-decoration: none;
            margin-top: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.2s ease;
        }

        .btn-photos:hover {
            background: var(--primary);
            color: #000000;
            box-shadow: 0 0 12px rgba(249, 115, 22, 0.4);
        }

        .btn-photos:active { transform: scale(0.98); }

        .btn-sticker {
            background: var(--primary);
            color: #000000;
            width: 100%;
            margin-top: 15px;
            padding: 12px;
            font-size: 0.95rem;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            border: none;
            cursor: pointer;
            font-weight: bold;
        }

        .btn-sticker:hover {
            background: var(--primary-hover);
        }

        .result-card {
            background: #000000;
            border-radius: 12px;
            padding: 18px;
            border: 1px solid var(--border-color);
            text-align: left;
            display: none;
            word-break: break-word;
        }

        .result-item {
            margin-bottom: 12px;
        }

        .result-item:last-child {
            margin-bottom: 0;
        }

        .label {
            font-size: 0.75rem;
            color: #a1a1aa;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 4px;
        }

        .value {
            font-size: 1.2rem;
            font-weight: bold;
            color: #ffffff;
        }

        .value-time {
            font-size: 1.8rem;
            font-family: monospace;
            color: var(--primary);
            background: #000;
            padding: 6px 12px;
            border-radius: 8px;
            display: inline-block;
            border: 1px solid var(--primary);
            margin-top: 4px;
            max-width: 100%;
            overflow-x: auto;
        }

        .badge-cat {
            background: #18181b;
            color: var(--primary);
            border: 1px solid var(--primary);
            font-size: 0.8rem;
            padding: 3px 8px;
            border-radius: 6px;
            margin-right: 5px;
            display: inline-block;
            margin-top: 4px;
        }

        .error-msg {
            color: var(--danger);
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid var(--danger);
            padding: 12px;
            border-radius: 8px;
            display: none;
            font-weight: bold;
        }

        @media (max-width: 400px) {
            .input-box {
                flex-direction: column;
            }
            .btn-search {
                padding: 12px;
                width: 100%;
            }
        }
    </style>
</head>
<body>

    <div class="search-card">
        <div class="brand-title">PAYNAL RACE</div>
        <div class="sub-title">Consulta de Corredor</div>

        <form onsubmit="consultarCorredor(event)">
            <div class="input-box">
                <input type="number" id="runner-id-input" placeholder="DORSAL" autocomplete="off" autofocus required>
                <button type="submit" class="btn-search">Buscar</button>
            </div>
        </form>

        <a href="fotoscarrera.html" class="btn-photos">
            📸 Ver Fotos de Carrera
        </a>

        <div id="error-box" class="error-msg" style="margin-top: 15px;"></div>

        <div id="result-box" class="result-card" style="margin-top: 15px;">
            <div class="result-item">
                <div class="label">Número de Dorsal:</div>
                <div class="value" id="res-dorsal" style="color: var(--primary);">DORSAL --</div>
            </div>

            <div class="result-item">
                <div class="label">Nombre del Corredor:</div>
                <div class="value" id="res-nombre">--</div>
            </div>

            <div class="result-item">
                <div class="label">Categoría(s):</div>
                <div id="res-categorias">--</div>
            </div>

            <div class="result-item">
                <div class="label">Tiempo Final:</div>
                <div class="value-time" id="res-tiempo">--:--:--.--</div>
            </div>

            <button type="button" class="btn-sticker" onclick="generarStickerTransparente()">
                🏷️ Descargar Sticker Transparente PNG
            </button>
        </div>
    </div>

    <canvas id="sticker-canvas" width="800" height="540" style="display:none;"></canvas>

    <script>
        let currentRunnerData = null;

        function parseTimeToMs(timeStr) {
            if (!timeStr || typeof timeStr !== 'string') return 0;
            const parts = timeStr.trim().split(':');
            let hours = 0, minutes = 0, seconds = 0;

            if (parts.length === 3) {
                hours = parseFloat(parts[0]);
                minutes = parseFloat(parts[1]);
                seconds = parseFloat(parts[2]);
            } else if (parts.length === 2) {
                minutes = parseFloat(parts[0]);
                seconds = parseFloat(parts[1]);
            } else {
                seconds = parseFloat(parts[0]);
            }

            return (hours * 3600 + minutes * 60 + seconds) * 1000;
        }

        function formatMsToTime(ms) {
            if (ms < 0 || isNaN(ms)) ms = 0;
            const totalSeconds = ms / 1000;
            const hours = Math.floor(totalSeconds / 3600);
            const minutes = Math.floor((totalSeconds % 3600) / 60);
            const seconds = (totalSeconds % 60).toFixed(2);

            const pad = (num, size = 2) => String(num).padStart(size, '0');
            const secParts = String(seconds).split('.');
            const formattedSec = pad(secParts[0]) + '.' + (secParts[1] || '00').padEnd(2, '0');

            if (hours > 0) {
                return `${pad(hours)}:${pad(minutes)}:${formattedSec}`;
            }
            return `${pad(minutes)}:${formattedSec}`;
        }

        async function consultarCorredor(e) {
            e.preventDefault();
            const input = document.getElementById('runner-id-input');
            const rId = String(input.value).trim();

            const resultBox = document.getElementById('result-box');
            const errorBox = document.getElementById('error-box');

            if (!rId) return;

            try {
                const res = await fetch('./cronometros/datos/data.json');
                const dbData = await res.json();

                const corredor = (dbData.corredores || []).find(r => String(r.id) === rId);

                if (!corredor) {
                    resultBox.style.display = 'none';
                    errorBox.innerText = `El dorsal NO. ${rId} no está registrado.`;
                    errorBox.style.display = 'block';
                    input.select();
                    currentRunnerData = null;
                    return;
                }

                const nombresCategorias = (corredor.categorias || []).map(catId => {
                    const cat = (dbData.categorias || []).find(c => String(c.id) === String(catId));
                    return cat ? cat.nombre : catId;
                });

                let mejorTiempoFinal = 'Sin tiempo';
                let maxVueltas = 0;
                let rawLaps = [];

                const tiempos = dbData.tiempos || {};
                Object.keys(tiempos).forEach(key => {
                    const parts = key.split('-');
                    const currentRunnerId = parts[parts.length - 1];
                    
                    if (String(currentRunnerId) === rId) {
                        const laps = tiempos[key];
                        if (Array.isArray(laps) && laps.length >= maxVueltas && laps.length > 0) {
                            maxVueltas = laps.length;
                            mejorTiempoFinal = laps[laps.length - 1];
                            rawLaps = laps;
                        }
                    }
                });

                const lapDetails = rawLaps.slice(0, 5).map((lapTimeStr, idx) => {
                    const currentMs = parseTimeToMs(lapTimeStr);
                    const prevMs = idx > 0 ? parseTimeToMs(rawLaps[idx - 1]) : 0;
                    const diffMs = currentMs - prevMs;
                    return {
                        lapNum: idx + 1,
                        lapTime: formatMsToTime(diffMs)
                    };
                });

                currentRunnerData = {
                    id: corredor.id,
                    nombre: corredor.nombre,
                    categorias: nombresCategorias.join(', '),
                    tiempo: mejorTiempoFinal,
                    laps: lapDetails
                };

                document.getElementById('res-dorsal').innerText = `DORSAL ${corredor.id}`;
                document.getElementById('res-nombre').innerText = corredor.nombre;
                
                document.getElementById('res-categorias').innerHTML = nombresCategorias.length > 0
                    ? nombresCategorias.map(c => `<span class="badge-cat">${c}</span>`).join('')
                    : '<span style="color:#aaa;">Sin categoría</span>';

                document.getElementById('res-tiempo').innerText = mejorTiempoFinal;

                errorBox.style.display = 'none';
                resultBox.style.display = 'block';
                input.select();

            } catch (err) {
                console.error("Error al consultar la base de datos:", err);
                errorBox.innerText = "Error de conexión con el servidor.";
                errorBox.style.display = 'block';
                resultBox.style.display = 'none';
                currentRunnerData = null;
            }
        }

        function generarStickerTransparente() {
            if (!currentRunnerData) return;

            const canvas = document.getElementById('sticker-canvas');
            const ctx = canvas.getContext('2d');

            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.textBaseline = 'top';

            // Marca de la Carrera
            ctx.fillStyle = '#f97316';
            ctx.font = '900 24px "Segoe UI", Arial, sans-serif';
            ctx.fillText('PAYNAL RACE', 20, 15);

            // Nombre del Corredor
            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 50px "Segoe UI", Arial, sans-serif';
            let nombreText = currentRunnerData.nombre;
            if (nombreText.length > 22) nombreText = nombreText.substring(0, 22) + '...';
            ctx.fillText(nombreText, 20, 50);

            // Número de Dorsal (Con tamaño dinámico para evitar solapamientos)
            ctx.fillStyle = '#f97316';
            ctx.font = 'bold 55px "Segoe UI", Arial, sans-serif';
            const dorsalStr = `DORSAL: ${currentRunnerData.id}`;
            ctx.fillText(dorsalStr, 20, 115);

            // Calcular ancho ocupado por el Dorsal para separar la Categoría correctamente
            const dorsalWidth = ctx.measureText(dorsalStr).width;
            const categoryX = Math.max(20 + dorsalWidth + 30, 380);

            // Etiqueta y Nombre de Categoría
            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 16px "Segoe UI", Arial, sans-serif';
            ctx.fillText('CATEGORÍA:', categoryX, 120);

            ctx.fillStyle = '#f97316';
            ctx.font = 'bold 24px "Segoe UI", Arial, sans-serif';
            ctx.fillText(currentRunnerData.categorias || 'General', categoryX, 142);

            // Tiempos Parciales
            let currentY = 195;

            if (currentRunnerData.laps && currentRunnerData.laps.length > 0) {
                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 16px "Segoe UI", Arial, sans-serif';
                ctx.fillText('TIEMPOS PARCIALES:', 20, currentY);
                currentY += 24;

                currentRunnerData.laps.forEach(lap => {
                    ctx.fillStyle = '#ffffff';
                    ctx.font = 'bold 22px monospace';
                    ctx.fillText(`V${lap.lapNum}: ${lap.lapTime}`, 20, currentY);

                    currentY += 28;
                });
            }

            // Tiempo Final en Grande
            currentY += 15;
            ctx.fillStyle = '#f97316';
            ctx.font = 'bold monospace 90px "Courier New", Courier';
            ctx.fillText(currentRunnerData.tiempo, 20, currentY);

            // Descargar la imagen PNG
            const link = document.createElement('a');
            link.download = `paynal-race-dorsal-${currentRunnerData.id}.png`;
            link.href = canvas.toDataURL('image/png');
            link.click();
        }
    </script>
</body>
</html>
